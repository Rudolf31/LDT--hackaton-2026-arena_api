              schema: {$ref: '#/components/schemas/ReducedSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # =====================================================================
  # НАЗНАЧЕНИЯ
  # =====================================================================
  /api/portal/assignments:
    get:
      tags: ["Назначения"]
      operationId: listAssignments
      summary: "Назначения со статусом прохождения"
      description: |
        Только назначения групп, к которым у пользователя есть доступ; `group_id` без доступа — 403.
        Статус выводится по порядку из arena-db.md, 3.4: отменено → код заблокирован → идёт → прошёл →
        прервана → срок истёк → не начал.
      x-roles: [methodologist, observer, admin]
      x-group-access: true
      x-uc: [UC-H-03]
      x-fr: [FR-AC-12, FR-AC-08, FR-ST-03]
      security:
        - portalCookie: []
      parameters:
        - {name: id, in: query, schema: {type: string, format: uuid}, description: "Одно назначение (вместо отдельного адреса)."}
        - {name: group_id, in: query, schema: {type: string, format: uuid}}
        - {name: subject_id, in: query, schema: {type: string, format: uuid}}
        - {name: scenario_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AssignmentStatus'}}
        - {name: batch_id, in: query, schema: {type: string, format: uuid}}
        - {name: due_before, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница назначений.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: ["Назначения"]
      operationId: createAssignments
      summary: "Назначить версию сценария одному сотруднику или списку"
      description: |
        Одно назначение и один код на каждого сотрудника; у списка общий `batch_id` (FR-AC-12). Все сотрудники
        — из групп с доступом. В оценке сотрудник без ФИО не назначается, а попадает в `skipped` с причиной
        (FR-AC-05); если не назначен никто — 422. Профиль: указанный, иначе профиль группы, иначе по умолчанию.
        Архивный сценарий — 409.

        Коды и ссылки в ответе показываются **один раз**: в базе только хеш (FR-AC-02). Кнопка в интерфейсе
        блокируется до ответа; повторная отправка создаст второй набор назначений.

        Селектор кода — 20 бит и уникален среди действующих кодов, поэтому в большой пачке совпадение
        возможно. Каждый код вставляется через точку сохранения; при нарушении `access_codes_active_selector`
        код выпускается заново, до 5 попыток — пачка не откатывается целиком.
      x-roles: [methodologist, observer, admin]
      x-group-access: true
      x-uc: [UC-H-01, UC-H-02]
      x-fr: [FR-AC-01, FR-AC-02, FR-AC-05, FR-AC-12, FR-PF-02, FR-PF-04, FR-PF-05, FR-SC-09, FR-MD-01, NFR-S-03]
      security:
        - portalCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentCreate'}
      responses:
        '201':
          description: Назначения созданы; коды показаны один раз.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentCreateResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/assignments/reissue-codes:
    post:
      tags: ["Назначения"]
      operationId: reissueCodes
      summary: "Перевыпустить коды — одному или нескольким"
      description: |
        Для каждого назначения в одной транзакции: старый код недействителен немедленно, новый выпущен
        (FR-AC-12). Снимает и блокировку — новый код с нулём попыток. Новые коды показываются один раз.
        Отменённые назначения — в `skipped`. Совпадение селектора — как при создании: точка сохранения
        на каждый код и до 5 попыток выпустить его заново.
      x-roles: [methodologist, observer, admin]
      x-group-access: true
      x-uc: [UC-H-03, UC-H-01, UC-H-02]
      x-fr: [FR-AC-12, FR-AC-02, NFR-S-03]
      security:
        - portalCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReissueRequest'}
      responses:
        '200':
          description: Новые коды.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentCreateResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/portal/assignments/{assignmentId}:
