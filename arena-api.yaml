        (изменились только теги или `authoring`) — 409 `nothing_changed` «Содержание не изменилось — публиковать
        нечего». Число засчитанных репетиций и порог записываются в версию.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-07, UC-M-09]
      x-fr: [FR-SC-08, FR-SC-09, FR-SC-11, FR-MD-01, FR-AC-01]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '201':
          description: Версия опубликована.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

