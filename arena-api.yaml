  /api/portal/scenarios/{scenarioId}/versions/{versionNumber}/health:
    get:
      tags: ["Здоровье сценария"]
      operationId: getScenarioHealth
      summary: "Здоровье версии сценария"
      description: |
        Считается по сессиям версии без демо (FR-AC-10) и без репетиций, по всем группам — это статистика
        сценария, не результаты людей: имён и текстов здесь нет. Выборка меньше 30 — `small_sample`
        с числом сессий (FR-ST-09). Уровень сложности — необязательный фильтр.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-11, UC-S-01, UC-S-05]
      x-fr: [FR-ST-01, FR-ST-03, FR-ST-09, FR-AC-10, FR-RS-13]
      security:
