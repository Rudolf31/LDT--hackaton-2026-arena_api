  /api/trainer/rehearsals/redeem:
    post:
      tags: ["Тренажёр — репетиция"]
      operationId: trainerRedeemRehearsalLink
      summary: "Открыть ссылку на репетицию: весь черновик, профиль с ключами, токен репетиции"
      description: |
        Репетиция идёт в тренажёре (FR-SC-10). Тренажёр берёт токен из ссылки (после `#`) и гасит его: второй раз
        ссылка не сработает. В ответе — весь документ черновика как есть, ровно с отпечатком ссылки (обе
        половины: методолог — автор сценария), уровень сложности (его применяет сам тренажёр функцией пакета
        движка), профиль тренажёра и доступ к моделям **с ключами**, как при старте сессии, и токен репетиции
        для загрузки записи. Экрана согласия нет: разговаривает автор сценария, данных сотрудников
        в репетиции нет.

        Погашение — один UPDATE с условием «ещё не погашена и не истекла», поэтому два одновременных открытия
        не получат ключи дважды. Черновик после выдачи ссылки сменил отпечаток — 409 `fingerprint_changed`
        «Черновик изменился — нажмите „Репетировать“ ещё раз». Ссылка уже открыта — 410 `rehearsal_link_used`,
        истекла — 410 `rehearsal_link_expired`. Пользователь, получивший ссылку, отключён или больше не методолог
        и не администратор — 403. Ограничение частоты по адресу — 10 запросов в минуту.
      x-public: true
      x-roles: [public]
      x-uc: [UC-M-08]
      x-fr: [FR-SC-10, FR-PF-02, FR-PF-05, NFR-M-02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RehearsalRedeemRequest'}
      responses:
        '200':
          description: Ссылка погашена; всё для репетиции.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RehearsalRedeemResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/trainer/rehearsals/{rehearsalId}/record:
    post:
      tags: ["Тренажёр — репетиция"]
      operationId: trainerUploadRehearsal
      summary: "Загрузить запись репетиции с пошаговым разбором"
      description: |
        Один запрос в конце репетиции: реплики в той же форме, что события сессии (`TurnEvent`), отказы
        компонентов, разбор каждой реплики, финал и ответ судьи после разговора. Портал проверяет тело так же,
        как события и завершение сессии (закрытые схемы пакета движка, ключ `emotion` — 400), пересчитывает обе
        оценки функциями пакета движка и сохраняет запись с отпечатком ссылки. Тексты — автора сценария,
        не участника: ключом участника они не шифруются.

        В режиме репетиции тренажёр не передаёт оппоненту меток эмоций с камеры, поэтому в разборе есть текст
        запроса к оппоненту — в отличие от `engine_step` сессии.

        Отпечаток в теле не равен отпечатку ссылки — 409 `fingerprint_changed`. Повтор после обрыва связи
        возвращает сохранённую запись с кодом 200; тело повтора не сравнивается. Тело — до 5 МБ. Загруженная
        запись засчитывается в допуск к оценке своего отпечатка (FR-SC-11); сессией она не становится
        и в статистику не входит.
      x-roles: [rehearsal]
      x-uc: [UC-M-08, UC-M-09]
      x-fr: [FR-SC-10, FR-SC-11, FR-RS-02, FR-RS-04, NFR-R-03]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/RehearsalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RehearsalRecordUpload'}
      responses:
        '200':
          description: Запись уже была загружена — возвращена она.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rehearsal'}
        '201':
          description: Запись сохранена; оценки в расчёте портала.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rehearsal'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}

