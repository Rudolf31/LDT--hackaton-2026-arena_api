  # =====================================================================
  # ГЕНЕРАЦИЯ ИЗ БРИФА
  # =====================================================================
  /api/portal/scenarios/{scenarioId}/generation:
    get:
      tags: ["Генерация из брифа"]
      operationId: getGeneration
      summary: "Ход генерации: шаг, состояние, результат шага"
      description: |
        Экран опрашивает этот адрес раз в 2 секунды, пока `status = running` (NFR-P-01: генерация асинхронна
        и показывает ход). При сбое анкета и подтверждённые шаги сохраняются, `error` говорит, что случилось
        и когда можно повторить.

        Задание генерации живёт в памяти процесса. При старте портал закрывает зависшие задания:
        `UPDATE scenarios SET generation = generation || '{"status": "failed", "error": {"message": "Портал
        перезапускался — повторите шаг"}}' WHERE generation->>'status' = 'running'` — иначе генерация навсегда
        осталась бы в `running`.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-01]
      x-fr: [FR-SC-03, FR-SC-04, NFR-P-01, NFR-R-03]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Состояние генерации.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/portal/scenarios/{scenarioId}/generation/steps/{step}/confirm:
    post:
      tags: ["Генерация из брифа"]
      operationId: confirmGenerationStep
      summary: "Подтвердить шаг с правками человека и запустить следующий"
      description: |
        Тело — поля шага после правок (формат, раздел 18). Шаг 1 → запускается шаг 2; шаг 2 → проверка зоны
        сделки (правило 1): пустая зона — 422 с сообщениями на полях, шаг не подтверждается; иначе запускается
        шаг 3. Шаг 3 → собирается черновик с `origin = brief`, генерация закрывается, `status = done`.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-01]
      x-fr: [FR-SC-04, FR-SC-05, FR-SC-07, FR-SC-13]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/GenerationStep'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationConfirm'}
      responses:
        '200':
          description: Шаг подтверждён.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/scenarios/{scenarioId}/generation/steps/{step}/regenerate:
    post:
      tags: ["Генерация из брифа"]
      operationId: regenerateGenerationStep
      summary: "Сгенерировать шаг заново"
      description: |
        Перезаписывает только поля этого шага; подтверждённые раньше шаги не меняются (приёмка FR-SC-04).
        Для шага 1 можно передать исправленную анкету. Считается в лимит частоты генерации.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-01]
      x-fr: [FR-SC-03, FR-SC-04, NFR-S-02]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/GenerationStep'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationRegenerate'}
      responses:
        '202':
          description: Генерация шага запущена.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # =====================================================================
  # РЕПЕТИЦИИ
  # =====================================================================
  /api/portal/scenarios/{scenarioId}/rehearsals:
    get:
      tags: ["Репетиции"]
      operationId: listRehearsals
      summary: "Репетиции сценария или одной версии и счётчик допуска"
      description: |
        Репетиции сценария, новые сверху, с состоянием: ссылка выдана, идёт, запись загружена, истекла.
        С `fingerprint` — только репетиции этого отпечатка: так экран «Сценарий — репетиция» показывает
        все репетиции одной версии. Допуск считается для текущего отпечатка черновика.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-08, UC-M-09]
      x-fr: [FR-SC-10, FR-SC-11]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - name: fingerprint
          in: query
          required: false
          description: Отпечаток версии или черновика.
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200':
          description: Репетиции и допуск для текущего отпечатка черновика.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RehearsalList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: ["Репетиции"]
      operationId: issueRehearsalLink
      summary: "Выдать одноразовую ссылку на репетицию текущего черновика"
      description: |
        Кнопка «Репетировать». Репетиция идёт в тренажёре, портал для неё моделей не вызывает (FR-SC-10):
        он выдаёт ссылку, а потом принимает запись. Ссылка привязана к отпечатку текущего черновика, уровню
        сложности, профилю тренажёра и пользователю, который её получил. Работает один раз и 30 минут.

        Токен стоит в ссылке после `#` и в журналы веб-серверов не попадает; в базе — только его HMAC.
        Ссылка показывается один раз, только в ответе на этот запрос. Ключей в ответе нет (FR-PF-04): их
        получит тренажёр при погашении ссылки. Черновик с блокирующими ошибками проверки — 422: тренажёр
        такой сценарий не запустит. Сценарий в архиве — 409 `archived`.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-08, UC-M-09]
      x-fr: [FR-SC-10, FR-SC-11, FR-PF-02, FR-PF-04, FR-PF-05]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RehearsalCreate'}
      responses:
        '201':
          description: Ссылка выдана.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RehearsalLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/rehearsals/{rehearsalId}:
    get:
      tags: ["Репетиции"]
      operationId: getRehearsal
      summary: "Репетиция с записью и разбором каждой реплики"
      description: |
        Запись, как её загрузил тренажёр, и обе оценки в пересчёте портала — по отдельности (FR-RS-04).
        Чтобы сравнить две репетиции, экран делает два таких запроса и ставит разборы рядом по номеру
        реплики (`reply_no`); отдельного адреса сравнения нет.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-08]
      x-fr: [FR-SC-10, FR-RS-04]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/RehearsalId'
      responses:
        '200':
          description: Репетиция.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rehearsal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

