  # =====================================================================
  # ВЫГРУЗКИ
  # =====================================================================
  /api/portal/exports:
    post:
      tags: ["Выгрузки"]
      operationId: createExport
      summary: "Выгрузка CSV или XLSX: итоговая или по репликам"
      description: |
        `dry_run: true` — ничего не выгружает и не пишет в журнал, отвечает JSON `ExportPreview`: сколько сессий
        и строк попадёт и из каких групп (экран подтверждения). Без него файл отдаётся сразу в ответе (на пилоте —
        сотни сессий). Группа в фильтре без доступа — 403 с названием группы (FR-RS-10); без фильтра группы —
        только группы с доступом. Обе оценки — отдельными столбцами, ФИО (псевдоним в тренировке), столбец «Режим»
        с пометкой для тренировки, пометки упрощённого режима и нарушений. Демо не выгружается.

        Журнал: **по одной строке `export_created` на каждую группу**, попавшую в выгрузку, — со своим `group_id`
        и `rows_count`; общий `export_id`, фильтры, вид и формат — в `details` (FR-RS-10: какую группу, сколько строк).
      x-roles: [methodologist, observer, admin]
      x-group-access: true
      x-uc: [UC-H-09]
      x-fr: [FR-ST-07, FR-RS-10, FR-RS-04, FR-ST-08, FR-AC-08, NFR-S-03]
      security:
        - portalCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '200':
          description: Файл выгрузки или, при `dry_run`, счётчики.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"arena-<срез>-<дата>.<csv|xlsx>\"` (кроме `dry_run`)"
              schema: {type: string}
            X-Rows-Count:
              description: Число строк в файле (то же, по группам, пишется в журнал).
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportPreview'}
            text/csv:
              schema: {type: string}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, contentEncoding: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  # =====================================================================
  # КАДРОВЫЕ РЕШЕНИЯ
  # =====================================================================
  /api/portal/decisions:
    post:
      tags: ["Кадровые решения"]
      operationId: createDecision
      summary: "Записать кадровое решение с основаниями"
      description: |
        Основания — собственный текст, хотя бы одна буква (FR-RS-08); интерфейс не подставляет туда резюме.
        Каждая сессия: того же сотрудника, оценочная, завершённая, не в упрощённом режиме, при нарушениях
        оппонента — просмотренная. Нарушение — 422 с причиной по каждой сессии («тренировка — не основание
        для кадрового решения»); то же держит база. Решения не правятся: пересмотр — новая запись
        с `supersedes_id`. Запись в журнал. В ответе — возражения по привязанным сессиям (UC-H-12). Отдельного
        адреса чтения решения нет: решения сотрудника — в его карточке, решения по сессии — в её результате.
      x-roles: [methodologist, observer, admin]
      x-group-access: true
      x-uc: [UC-H-11, UC-H-12]
      x-fr: [FR-RS-08, FR-MD-02, NFR-R-02, FR-RS-13, FR-AC-08, NFR-S-03]
      security:
        - portalCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionCreate'}
      responses:
        '201':
          description: Решение записано.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

