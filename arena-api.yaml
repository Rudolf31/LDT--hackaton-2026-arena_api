        - {name: final_id, in: query, schema: {type: string}}
        - {name: break_stage, in: query, schema: {type: string}, description: "Этап обрыва."}
        - {name: with_violations, in: query, schema: {type: boolean}}
        - {name: difficulty, in: query, schema: {$ref: '#/components/schemas/Difficulty'}}
        - $ref: '#/components/parameters/Limit'
