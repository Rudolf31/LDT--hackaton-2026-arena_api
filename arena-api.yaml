      responses:
        '200':
          description: Показатели здоровья.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScenarioHealth'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/portal/scenarios/{scenarioId}/versions/{versionNumber}/health/sessions:
    get:
      tags: ["Здоровье сценария"]
      operationId: listHealthSessions
      summary: "Сессии, в которых встретилась проблема"
      description: |
        Список без имён и текстов. `full_access` говорит, откроется ли сессия полностью
        (`GET /api/portal/sessions/{sessionId}`) или только урезанный вид (`…/reduced`).
      x-roles: [methodologist, admin]
