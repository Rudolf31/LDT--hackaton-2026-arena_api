      responses:
        '201':
          description: Пользователь заведён.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/users/{userId}:
    patch:
      tags: ["Пользователи и доступ"]
      operationId: updateUser
      summary: "Изменить роль, имя, пароль или отключить вход"
      description: "Действует сразу: права проверяются по базе на каждом запросе. Отключение закрывает сессии входа."
      x-roles: [admin]
      x-uc: [UC-A-06]
      x-fr: [FR-AC-08, FR-PF-04, NFR-S-03]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPatch'}
      responses:
        '200':
          description: Изменено.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/users/{userId}/group-access:
    put:
      tags: ["Пользователи и доступ"]
      operationId: setUserGroupAccess
      summary: "Задать список групп, к результатам которых открыт доступ"
      description: |
        Полный список: недостающие строки добавляются (`access_granted`), лишние удаляются (`access_revoked`) —
        каждая запись в журнал. Снятие действует со следующего запроса: 403 на чтение сессий и выгрузку группы.
      x-roles: [admin]
      x-uc: [UC-A-06]
      x-fr: [FR-AC-08, FR-RS-10, FR-ST-02, NFR-S-03]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupAccessPut'}
      responses:
        '200':
          description: Доступ сохранён.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  # =====================================================================
  # ЖУРНАЛ
  # =====================================================================
  /api/portal/audit-log:
    get:
      tags: ["Журнал"]
      operationId: listAuditLog
      summary: "Журнал доступа и действий"
      description: "Только чтение. Участник — номером, не именем. Отказы в доступе тоже видны (`outcome = denied`)."
      x-roles: [admin]
      x-uc: [UC-A-09, UC-A-01, UC-A-03, UC-A-08, UC-H-09]
      x-fr: [NFR-S-03, FR-RS-10, FR-PF-04, NFR-PR-01]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/FilterFrom'
        - $ref: '#/components/parameters/FilterTo'
        - {name: actor_user_id, in: query, schema: {type: string, format: uuid}}
        - {name: group_id, in: query, schema: {type: string, format: uuid}}
        - {name: subject_number, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {$ref: '#/components/schemas/AuditAction'}}
        - {name: outcome, in: query, schema: {type: string, enum: [ok, denied]}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница журнала, новые сверху.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/portal/audit-log/export:
    post:
      tags: ["Журнал"]
      operationId: exportAuditLog
      summary: "Выгрузить отфильтрованный журнал в CSV"
      description: "Только CSV. Сама выгрузка добавляет запись `audit_exported` с фильтрами и числом строк."
      x-roles: [admin]
      x-uc: [UC-A-09]
      x-fr: [NFR-S-03, FR-RS-10]
      security:
        - portalCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditExportRequest'}
      responses:
        '200':
          description: Файл журнала.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"arena-journal-<дата>.csv\"`"
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  # =====================================================================
  # НАСТРОЙКИ ПОРТАЛА
  # =====================================================================
  /api/portal/settings:
    get:
      tags: ["Настройки портала"]
      operationId: getPortalSettings
      summary: "Настройки портала и состояние демо-режима"
      description: "Демо-режим — только чтение: он задаётся переменной окружения (FR-AC-09)."
      x-roles: [methodologist, observer, admin]
      x-uc: [UC-A-07, UC-M-09]
      x-fr: [FR-AC-09, FR-SC-11]
      security:
        - portalCookie: []
      responses:
        '200':
          description: Настройки.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: ["Настройки портала"]
      operationId: updatePortalSettings
      summary: "Изменить порог репетиций, таймаут брошенной сессии, порог блокировки кода"
      description: "Новый порог допуска действует для следующих публикаций. Запись `settings_changed` в журнал."
      x-roles: [admin]
      x-uc: [UC-A-07]
      x-fr: [FR-SC-11, FR-ST-03, NFR-S-02, NFR-S-03]
      security:
        - portalCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PortalSettingsPatch'}
      responses:
        '200':
          description: Сохранено.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

components:
  securitySchemes:
    trainerToken:
      type: http
      scheme: bearer
      bearerFormat: подписанный токен участника
      description: |
        Выдаётся `POST /api/trainer/enter` (по коду) или `POST /api/trainer/demo/enter` (гостевой).
        Привязан к назначению и номеру участника; гостевой — к демо-участнику и своему `demo_guest_id`
        (по нему гость видит только свои сессии). Живёт 12 часов, хранится в `sessionStorage` вкладки.
        Токен репетиции выдаёт `POST /api/trainer/rehearsals/redeem`: он привязан к одной репетиции
        и пользователю портала, который получил ссылку, годится только для загрузки её записи и тоже живёт
        12 часов. Права проверяются по базе на каждом запросе.
    portalCookie:
      type: apiKey
      in: cookie
      name: arena_session
      description: |
        Сессия входа портала: httpOnly, Secure, SameSite=Strict, 8 часов без действий. Роль и доступ к группам
        в cookie не хранятся — читаются из базы на каждом запросе.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag черновика из `GET …/draft`. Не совпал — 412, правку сделал кто-то другой.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    FilterFrom:
      name: from
      in: query
      description: Начало периода (включительно), ISO 8601.
      schema: {type: string, format: date-time}
    FilterTo:
      name: to
      in: query
      description: Конец периода (не включительно), ISO 8601.
      schema: {type: string, format: date-time}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    GenerationStep:
      name: step
      in: path
      required: true
      schema: {type: integer, enum: [1, 2, 3]}
    RehearsalId:
      name: rehearsalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GroupId:
      name: groupId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubjectId:
      name: subjectId
      in: path
      required: true
      description: Номер участника (`subjects.id`); у сотрудника это и ключ таблицы `people`.
      schema: {type: string, format: uuid}
    ObjectionId:
      name: objectionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    BadRequest:
      description: Тело не разобрано или содержит лишнее поле (в том числе `emotion`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Нет входа или токен недействителен.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Роль или доступ к группе не позволяют; код заблокирован. Отказ пишется в журнал.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Не найдено (или демо выключено).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Действие противоречит состоянию (сессия уже закрыта, режим заблокирован, мало репетиций…).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Gone:
      description: Код больше не действует, назначение отменено или срок истёк.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: Черновик изменился после чтения.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooLarge:
      description: Тело больше 1 МБ или в пачке больше 100 событий.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: Данные не прошли проверку; `errors[]` — поля и сообщения обычными словами.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Превышена частота запросов; когда повторить — в `Retry-After` и в тексте.
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить.
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ------------------------------------------------------------------
    # Общее
    # ------------------------------------------------------------------
    Problem:
      type: object
      description: RFC 9457. Все тексты — по-русски, для человека.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Код ошибки для программы; список — arena-api.md, раздел «Ошибки».
          example: code_blocked
        title: {type: string, example: "Код заблокирован — обратитесь к HR"}
        status: {type: integer, example: 403}
        detail: {type: string}
        instance: {type: string, description: Идентификатор запроса для поиска в логах.}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        retry_after_seconds: {type: integer}
        data:
          type: object
          description: Сведения для экрана (например `{done, required}` для допуска, `missing_seqs` для завершения).
          additionalProperties: true
    FieldError:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: JSON Pointer к полю тела (`/document/issues/0/opponent/limit`).
        message: {type: string, example: "Предел оппонента должен быть не ниже его стартового предложения"}
        code: {type: string}
    PageMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
    SmallSample:
      type: object
      description: FR-ST-09. `small = true` при n < 30 — экран пишет «мало данных (n = …)».
      required: [n, small]
      properties:
        n: {type: integer}
        small: {type: boolean}

    Role: {type: string, enum: [methodologist, observer, admin]}
    Mode: {type: string, enum: [training, assessment]}
    Origin: {type: string, enum: [brief, template, copy, manual]}
    Difficulty: {type: string, enum: [easy, normal, hard]}
    FinalRank: {type: string, enum: [S, A, B, C, D, F]}
    SessionStatus:
      type: string
      enum: [in_progress, completed, ended_by_participant, turn_limit, time_limit, connection_lost, abandoned]
      description: |
        идёт · завершена · прервана участником · закончились ходы · закончилось время · прервана: потеря связи ·
        прервана (закрыта сервером по таймауту).
    ClosingStatus:
      type: string
      enum: [completed, ended_by_participant, turn_limit, time_limit, connection_lost]
      description: Статусы, которые ставит клиент при завершении; `abandoned` ставит только сервер.
    ProcessStatus:
      type: string
      enum: [pending, ok, not_received, too_short, not_scored]
    ScoringProfile: {type: string, enum: [normal, short]}
    Speaker: {type: string, enum: [participant, opponent]}
    MoveSource: {type: string, enum: [judge, keywords]}
    ModelRoute: {type: string, enum: [openrouter, own_server, stub]}
    ConsentKind: {type: string, enum: [notice_training, consent_assessment, consent_external_ai, notice_demo, written_assessment]}
    ConsentAnswerValue: {type: string, enum: [acknowledged, granted, refused]}
    Sphere: {type: string, enum: [procurement, internal_promotion, internal_client, sales, contractor_deadline, resource_split, other]}
    NegotiationType: {type: string, enum: [distributive, integrative, mixed]}
    Criterion: {type: string, enum: [diagnosis, interests, criteria, alternative, discipline, conduct]}
    AssignmentStatus:
      type: string
      enum: [not_started, in_progress, passed, abandoned, expired, cancelled, code_blocked]
      description: не начал · идёт · прошёл · прервана · срок истёк · отменено · код заблокирован. Вычисляется, не хранится.
    AuditAction:
      type: string
      enum: [login, login_failed, session_opened, session_reduced_opened, session_reviewed, export_created, audit_exported,
             assignment_created, assignment_cancelled, assignment_extended, code_issued, code_reissued, code_blocked,
             code_unblocked, decision_recorded, objection_submitted, objection_answered, profile_saved,
             profile_key_changed, user_saved, access_granted, access_revoked, person_saved, consent_withdrawn,
             external_ai_withdrawn, written_consent_recorded, group_saved, scenario_published, scenario_mode_changed,
             scenario_archived, settings_changed, session_closed_by_server, session_reopened]

    EngineObject:
      type: object
      additionalProperties: true
      description: |
        Объект, форма которого принадлежит пакету движка (решение 02, формат 19): портал хранит его как есть
        и не заглядывает внутрь. В телах тренажёра (`engine_step`, `judge`, `opponent_judge`, `offer`, `terms`,
        `client_scores`) портал проверяет такой объект по закрытой JSON-схеме, которую экспортирует пакет движка,
        и дополнительно ищет ключ с именем ровно `emotion` (FR-RS-02).

    ScenarioDocument:
      $ref: 'arena-scenario.schema.json'

    # ------------------------------------------------------------------
    # Тренажёр — вход и настройки
    # ------------------------------------------------------------------
    EnterRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: Код `ARENA-XXXX-XXXX-XXX`; регистр, пробелы и дефисы нормализуются, `O→0`, `I/L→1` (Crockford).
          example: ARENA-7K3Q-9DXM-2PA
    EnterResponse:
      type: object
      required: [token, token_expires_at, participant, next, has_results, settings]
      properties:
        token: {type: string, description: Токен участника; для демо — гостевой.}
        token_expires_at: {type: string, format: date-time}
        is_demo: {type: boolean}
        participant:
          type: object
          required: [number, display_name]
          properties:
            number: {type: string, example: N-7K3Q9D}
            display_name: {type: string, description: ФИО или псевдоним; у гостя — «Гость демо».}
        assignment:
          type: [object, 'null']
          description: У демо — null.
          properties:
            id: {type: string, format: uuid}
            mode: {$ref: '#/components/schemas/Mode'}
            difficulty: {$ref: '#/components/schemas/Difficulty'}
            due_at: {type: string, format: date-time}
        next:
          type: string
          enum: [brief, resume, results]
          description: brief — показать бриф и начать; resume — вернуться в идущую сессию; results — «Мои результаты».
        running_session_id: {type: [string, 'null'], format: uuid}
        has_results: {type: boolean}
        can_start_new:
          type: boolean
          description: Можно ли начать новую попытку (в оценке после завершённой сессии — нет).
        settings: {$ref: '#/components/schemas/TrainerSettings'}
    TrainerSettings:
      type: object
      description: Всё, что клиенту нужно до старта. Ни одного ключа, предела оппонента, скрытого факта или условия перехода.
      required: [format, engine_version, scenario, profile, consent_screen]
      properties:
        format: {type: string, example: arena-scenario/1, description: "Незнакомый номер — клиент не начинает и просит обновиться."}
        engine_version: {type: string, example: 1.4.0}
        scenario: {$ref: '#/components/schemas/ScenarioPublicPart'}
        profile: {$ref: '#/components/schemas/TrainerProfileForClient'}
        consent_screen: {$ref: '#/components/schemas/ConsentScreen'}
    ScenarioPublicPart:
      type: object
      description: Часть «до старта» из формата сценария, раздел 16, с применённым уровнем сложности.
      required: [fingerprint, passport, difficulty, brief, opponent_card, issues]
      properties:
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        passport:
          type: object
          required: [id, version, title, mode, sphere, negotiation_type]
          properties:
            id: {type: string}
            version: {type: integer}
            title: {type: string}
            mode: {$ref: '#/components/schemas/Mode'}
            sphere: {$ref: '#/components/schemas/Sphere'}
            negotiation_type: {$ref: '#/components/schemas/NegotiationType'}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        brief: {$ref: 'arena-scenario.schema.json#/$defs/brief'}
        opponent_card: {$ref: 'arena-scenario.schema.json#/$defs/opponent/properties/card'}
        issues:
          type: array
          description: Только открытые предметы; у каждого `id`, `label`, `type`, `unit`, `direction`, `options`, `participant` — без `revealed_by_fact` и без стороны оппонента.
          items: {$ref: '#/components/schemas/EngineObject'}
    ScenarioPrivatePart:
      type: object
      description: |
        Часть «после старта» из формата, раздел 16: только в память клиента, не на диск и не в логи, не показывается
        участнику. Поля `note` убраны.
      required: [opponent_brief, issues, state, facts, evidence_weights, move_effects, process_criteria, start_stage, stages, end_stages, finals]
      properties:
        opponent_brief: {$ref: 'arena-scenario.schema.json#/$defs/opponent/properties/brief'}
        issues:
          type: array
          description: Все предметы целиком, со стороной оппонента и зависимыми пределами; скрытые — тоже.
          items: {$ref: '#/components/schemas/EngineObject'}
        state: {$ref: 'arena-scenario.schema.json#/$defs/state'}
        facts: {type: array, items: {$ref: 'arena-scenario.schema.json#/$defs/fact'}}
        custom_moves: {type: array, items: {$ref: 'arena-scenario.schema.json#/$defs/customMove'}}
        evidence_weights: {$ref: 'arena-scenario.schema.json#/$defs/evidenceWeights'}
        move_effects: {type: array, items: {$ref: 'arena-scenario.schema.json#/$defs/moveEffect'}}
        jailbreak: {$ref: 'arena-scenario.schema.json#/$defs/jailbreak'}
        process_criteria: {type: string, example: harvard_spin_v1}
        start_stage: {type: string}
        stages: {type: array, items: {$ref: 'arena-scenario.schema.json#/$defs/stage'}}
        end_stages: {type: array, items: {type: string}}
        wrapup_stage: {type: string}
        finals: {type: array, items: {$ref: 'arena-scenario.schema.json#/$defs/final'}}
    TrainerProfileSettings:
      type: object
      additionalProperties: false
      description: |
        Настройки профиля тренажёра. Схема закрыта на всех уровнях: поле вне схемы — 422, поэтому ключ или токен
        сюда не положить (эти настройки видят наблюдатель, методолог, участник до согласия и HR в снимке профиля).
        Ключи — только в отдельных столбцах через `PUT …/keys`. Адреса — без встроенного логина и без параметров
        запроса. Пустое поле берётся из профиля по умолчанию.
      properties:
        openrouter:
          type: [object, 'null']
          additionalProperties: false
          properties:
            base_url: {$ref: '#/components/schemas/ServiceUrl'}
        model_server:
          type: [object, 'null']
          additionalProperties: false
          properties:
            base_url: {$ref: '#/components/schemas/ServiceUrl'}
        primary_route: {type: string, enum: [openrouter, own_server]}
        models:
          type: object
          additionalProperties: false
          properties:
            opponent: {$ref: '#/components/schemas/ModelSettings'}
            participant_judge: {$ref: '#/components/schemas/ModelSettings'}
            opponent_judge: {$ref: '#/components/schemas/ModelSettings'}
        speech:
          type: object
          additionalProperties: false
          properties:
            asr: {$ref: '#/components/schemas/SpeechSettings'}
            tts: {$ref: '#/components/schemas/SpeechSettings'}
        input_mode: {type: string, enum: [push_to_talk, open_mic, text]}
        camera:
          type: object
          additionalProperties: false
          properties:
            enabled: {type: boolean}
            emotion_labels_to_opponent: {type: boolean}
        limits:
          type: object
          additionalProperties: false
          properties:
            max_turns: {type: integer, minimum: 1}
            session_minutes: {type: integer, minimum: 1}
        model_providers_note:
          type: string
          description: «Разработчики моделей и страны» — подставляется в текст про внешнюю нейросеть.
    ServiceUrl:
      type: string
      format: uri
      pattern: '^https?://[^/?#@]+(/[^?#]*)?$'
      description: Адрес сервиса без встроенного логина (`user:pass@`) и без параметров запроса — иначе 422.
    SpeechSettings:
      type: object
      additionalProperties: false
      properties:
        base_url: {$ref: '#/components/schemas/ServiceUrl'}
        model: {type: string, maxLength: 200}
        voice: {type: [string, 'null'], maxLength: 200, description: Голос по умолчанию; голос оппонента задаёт сценарий.}
    ModelSettings:
      type: object
      additionalProperties: false
      required: [model, context_window, max_tokens]
      properties:
        model: {type: string, example: "qwen/qwen3-32b"}
        own_server_model: {type: string}
        context_window: {type: integer, minimum: 1024}
        max_tokens: {type: integer, minimum: 1, description: "Обязательно у каждого вызова (NFR-C-01)."}
    TrainerProfileForClient:
      type: object
      description: |
        Профиль в ответе тренажёру: настройки без ключей, только адреса. Если согласие на внешнюю нейросеть
        отозвано (`people.external_ai_withdrawn_at`), блока `openrouter` нет вовсе.
      required: [id, revision, settings]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer}
        settings: {$ref: '#/components/schemas/TrainerProfileSettings'}
    ConsentScreen:
      type: object
      description: |
        Что показать на экране «Согласие и уведомление». Тексты уже с подстановками (ФИО, табельный номер, адреса
        моделей); вариант А/Б/В выбран порталом по профилю (arena-consent-texts.md, 0).
      required: [variant, texts, can_proceed]
      properties:
        variant: {type: string, enum: [A, B, V], description: "А — только OpenRouter, Б — только наш сервер, В — оба."}
        texts:
          type: array
          items: {$ref: '#/components/schemas/ConsentTextShown'}
        can_proceed:
          type: boolean
          description: false — сессию начать нельзя (нет отметки о письменном согласии на оценку, не заполнены обязательные подстановки).
        blocked_reason: {type: [string, 'null'], example: "Нет отметки о письменном согласии — обратитесь к HR"}
    ConsentTextShown:
      type: object
      required: [kind, text_id, version, body, sha256, answers]
      properties:
        kind: {$ref: '#/components/schemas/ConsentKind'}
        text_id: {type: string, format: uuid}
        version: {type: string}
        title: {type: string}
        body: {type: string, description: Текст в том виде, как его увидит участник.}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 от `body` в UTF-8.}
        answers:
          type: array
          description: Допустимые ответы; ни один не выбран заранее.
          items: {$ref: '#/components/schemas/ConsentAnswerValue'}
    ConsentsRequest:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 2
          items: {$ref: '#/components/schemas/ConsentAnswer'}
    ConsentAnswer:
      type: object
      additionalProperties: false
      required: [kind, answer, text_id, shown_text_sha256]
      properties:
        kind:
          type: string
          enum: [notice_training, consent_assessment, consent_external_ai, notice_demo]
        answer: {$ref: '#/components/schemas/ConsentAnswerValue'}
        text_id: {type: string, format: uuid}
        shown_text_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    ConsentsResponse:
      type: object
      required: [records, can_start, external_ai_allowed]
      properties:
        records:
          type: array
          items: {$ref: '#/components/schemas/ConsentRecord'}
        can_start: {type: boolean}
        external_ai_allowed: {type: boolean}
        message:
          type: [string, 'null']
          description: Текст отказа из arena-consent-texts.md, раздел 6, если начать нельзя.
    ConsentRecord:
      type: object
      required: [id, kind, answer, answered_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/ConsentKind'}
        answer: {$ref: '#/components/schemas/ConsentAnswerValue'}
        text_version: {type: [string, 'null']}
        answered_at: {type: string, format: date-time}
        document_ref: {type: [string, 'null']}
        document_channel: {type: [string, 'null'], enum: [paper, edo, null]}
        signed_on: {type: [string, 'null'], format: date}
        valid_until: {type: [string, 'null'], format: date}
        recorded_by_name: {type: [string, 'null']}

    # ------------------------------------------------------------------
    # Тренажёр — сессия
    # ------------------------------------------------------------------
    StartSessionRequest:
      type: object
      additionalProperties: false
      required: [consent_ids]
      properties:
        consent_ids:
          type: array
          description: Записи из ответа на запрос 2 (этого участника и этого назначения).
          items: {type: string, format: uuid}
    SessionStartResponse:
      type: object
      required: [session, private_part, model_access, profile, restore]
      properties:
        session:
          type: object
          required: [id, status, started_at, mode, difficulty, is_demo]
          properties:
            id: {type: string, format: uuid}
            status: {$ref: '#/components/schemas/SessionStatus'}
            started_at: {type: string, format: date-time}
            mode: {$ref: '#/components/schemas/Mode'}
            difficulty: {$ref: '#/components/schemas/Difficulty'}
            is_demo: {type: boolean}
            profile_revision: {type: integer}
            criteria_set: {type: string, example: harvard_spin_v1}
            external_ai_allowed: {type: boolean}
        private_part: {$ref: '#/components/schemas/ScenarioPrivatePart'}
        model_access: {$ref: '#/components/schemas/ModelAccess'}
        profile:
          $ref: '#/components/schemas/TrainerProfileForClient'
        restore: {$ref: '#/components/schemas/RestoreState'}
    ModelAccess:
      type: object
      description: |
        Только в ответе старта, повторной выдачи и погашения ссылки репетиции, только в память. `openrouter_key`
        есть лишь при согласии на внешнюю нейросеть в этой сессии и если оно не отозвано (FR-AC-07); в репетиции
        согласия участника нет — разговаривает автор сценария, и выдаются оба ключа профиля. В демо оба поля `null` —
        модели на заглушке; исключение — `DEMO_MODEL_KEYS=1` на стенде жюри.
      required: [model_server_token, openrouter_key]
      properties:
        model_server_token: {type: [string, 'null']}
        openrouter_key: {type: [string, 'null']}
    RestoreState:
      type: object
      description: Для продолжения после F5. При старте — пусто.
      required: [turns, elapsed_ms]
      properties:
        turns:
          type: array
          description: Реплики в том виде, как клиент их прислал (тексты расшифрованы), по порядку `seq`.
          items: {$ref: '#/components/schemas/TurnEvent'}
        incidents:
          type: array
          items: {$ref: '#/components/schemas/IncidentEvent'}
        elapsed_ms: {type: integer}
    EventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/TurnEvent'
              - $ref: '#/components/schemas/IncidentEvent'
            discriminator:
              propertyName: type
              mapping:
                turn: '#/components/schemas/TurnEvent'
                incident: '#/components/schemas/IncidentEvent'
    TurnEvent:
      type: object
      additionalProperties: false
      description: |
        Одна реплика — одна строка `turns`. Поля участника у реплики оппонента и наоборот пусты (проверяет база).
        Реплика оппонента приходит уже с решением судьи оппонента или с `opponent_judge = null`, если судья не ответил.
        Пояснение судьи оппонента (`comment`, формат 11.6) передаётся **только** в `opponent_judge_comment`:
        портал шифрует его ключом участника, а `opponent_judge` с полем `comment` отклоняет (в базе — ограничение
        `turns_opponent_judge_no_comment`).
      required: [type, seq, speaker, reply_no, text, at_ms, stage]
      properties:
        type: {const: turn}
        seq: {type: integer, minimum: 0, description: Порядковый номер реплики в разговоре; ключ дедупликации.}
        speaker: {$ref: '#/components/schemas/Speaker'}
        reply_no: {type: integer, minimum: 0, description: "Номер для цитат: У3 / О3; О0 — первая реплика оппонента."}
        text: {type: string, maxLength: 4000}
        at_ms: {type: integer, minimum: 0}
        duration_ms: {type: [integer, 'null']}
        pause_ms: {type: [integer, 'null']}
        model_route: {oneOf: [{$ref: '#/components/schemas/ModelRoute'}, {type: 'null'}]}
        stage: {type: string, description: Этап после реплики.}
        transition_to: {type: [string, 'null']}
        move_type: {type: [string, 'null']}
        move_source: {oneOf: [{$ref: '#/components/schemas/MoveSource'}, {type: 'null'}]}
        judge_confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        evidence: {type: [string, 'null']}
        interest: {type: [string, 'null']}
        violations: {type: array, items: {type: string, enum: [insult, jailbreak_attempt, misstated_fact]}}
        judge: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
        terms: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
        trust: {type: [integer, 'null']}
        pressure: {type: [integer, 'null']}
        credibility: {type: [integer, 'null']}
        patience: {type: [integer, 'null']}
        credit: {type: [integer, 'null']}
        revealed_facts: {type: array, items: {type: string}}
        engine_step:
          oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]
          description: Пошаговый разбор хода **без текста запроса к оппоненту** (в нём метка эмоции).
        intent: {type: [string, 'null']}
        offer: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
        opponent_judge: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
        opponent_violation: {type: boolean, default: false}
        opponent_judge_comment: {type: [string, 'null'], maxLength: 1000}
        interrupted:
          type: boolean
          default: false
          description: |
            Только у реплики оппонента: её перебили или нажали «Завершить», пока она звучала. Перебитый
            ответ-согласие сделку не заключает (arena-scoring 3.4); без этого признака пересчёт на портале
            засчитал бы сделку, которой не было.
    IncidentEvent:
      type: object
      additionalProperties: false
      description: Отказ компонента или смена адреса моделей (NFR-R-01). Упрощённый режим отдельно не шлётся — он виден по `move_source = keywords`.
      required: [type, event_id, component, at_ms]
      properties:
        type: {const: incident}
        event_id: {type: string, format: uuid, description: Ключ дедупликации.}
        component: {type: string, enum: [camera, asr, tts, model_route, stub, participant_judge, opponent_judge, portal_link]}
        reply_no: {type: [integer, 'null']}
        at_ms: {type: integer}
        route_to: {oneOf: [{$ref: '#/components/schemas/ModelRoute'}, {type: 'null'}]}
        detail: {type: string, maxLength: 500, description: Обычными словами, без ключей и текстов реплик.}
    EventBatchResult:
      type: object
      required: [accepted, duplicates, contiguous_seq, session_status, reopened]
      properties:
        accepted: {type: integer}
        duplicates: {type: integer}
        contiguous_seq:
          type: integer
          description: Наибольший `seq`, до которого на портале нет пропусков; −1 — ходов нет.
        missing_seqs: {type: array, items: {type: integer}}
        session_status: {$ref: '#/components/schemas/SessionStatus'}
        reopened: {type: boolean, description: Сессия была закрыта сервером и этими событиями открыта снова.}
        note: {type: [string, 'null']}
    FinishRequest:
      type: object
      additionalProperties: false
      required: [status, last_seq, judge_attempts]
      properties:
        status: {$ref: '#/components/schemas/ClosingStatus'}
        last_seq: {type: integer, description: "Последний `seq` разговора: портал проверяет, что все ходы на месте."}
        final_id: {type: [string, 'null']}
        break_stage: {type: [string, 'null']}
        break_turn: {type: [integer, 'null']}
        judge_answer:
          oneOf: [{$ref: '#/components/schemas/JudgeAnswer'}, {type: 'null'}]
        judge_attempts: {type: integer, minimum: 0}
        client_scores:
          oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]
          description: Расчёт клиента — только для сверки; расхождение портал пишет в журнал ошибок и показывает свой.
    JudgeAnswer:
      type: object
      description: Ответ судьи участника после разговора как пришёл (arena-scoring 8.1). Проверяет его код портала.
      required: [criteria_set, episodes, summary]
      properties:
        criteria_set: {type: string}
        episodes:
          type: array
          items:
            type: object
            properties:
              indicator: {type: string}
              reply: {type: integer}
              speaker: {$ref: '#/components/schemas/Speaker'}
              quote: {type: string}
              context:
                type: [object, 'null']
                properties:
                  reply: {type: integer}
                  speaker: {$ref: '#/components/schemas/Speaker'}
                  quote: {type: string}
              interest: {type: [string, 'null']}
              why: {type: string}
        summary:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [strength, miss]}
              observation: {type: string}
              reply: {type: integer}
              speaker: {$ref: '#/components/schemas/Speaker'}
              quote: {type: string}
              instead: {type: string}
    JudgeAnswerRequest:
      type: object
      additionalProperties: false
      required: [judge_answer, judge_attempts]
      properties:
        judge_answer: {$ref: '#/components/schemas/JudgeAnswer'}
        judge_attempts: {type: integer, minimum: 1, description: Сколько всего раз запрашивали, включая прошлые.}
    JudgeRetryPack:
      type: object
      required: [session_id, transcript, judge_decisions, offer_log, opponent_interests, revealed_facts, participant_brief, model_access, profile]
      properties:
        session_id: {type: string, format: uuid}
        criteria_set: {type: string}
        transcript:
          type: array
          items: {$ref: '#/components/schemas/TranscriptLine'}
        judge_decisions:
          type: array
          description: Решения судьи по репликам участника (из `turns.judge`), с номерами реплик.
          items: {$ref: '#/components/schemas/EngineObject'}
        offer_log:
          type: array
          items: {$ref: '#/components/schemas/EngineObject'}
        code_episodes:
          type: array
          description: Эпизоды, найденные кодом, и сработавшие потолки (arena-scoring 8.1).
          items: {$ref: '#/components/schemas/EngineObject'}
        opponent_interests: {type: array, items: {$ref: '#/components/schemas/EngineObject'}}
        revealed_facts:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              text: {type: string}
        participant_brief: {$ref: 'arena-scenario.schema.json#/$defs/brief'}
        model_access: {$ref: '#/components/schemas/ModelAccess'}
        profile: {$ref: '#/components/schemas/TrainerProfileForClient'}

    # ------------------------------------------------------------------
    # Результаты (общие части)
    # ------------------------------------------------------------------
    TranscriptLine:
      type: object
      required: [reply_no, speaker, text, at_ms]
      properties:
        seq: {type: integer}
        reply_no: {type: integer}
        speaker: {$ref: '#/components/schemas/Speaker'}
        text:
          type: [string, 'null']
          description: null — реплика пришла после уничтожения ключа (отзыв согласия).
        at_ms: {type: integer}
        offer:
          oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]
          description: "У реплики оппонента — его предложение после неё `{предмет: значение}`. Для лесенки предложений и перехода «условие сделки → реплика»."
        terms:
          oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]
          description: "У реплики участника — что он сам предложил в ней `{предмет: значение}`. Для лесенки."
        stage:
          type: [string, 'null']
          description: Этап после реплики. Только в видах HR; участнику не отдаётся (arena-scoring 12.3).
        markers:
          type: array
          description: Метки на полях — засчитанный эпизод, шаг уступки, раскрытый факт, смена этапа (у HR), потолок.
          items:
            type: object
            properties:
              kind: {type: string, enum: [episode, concession, fact, stage, cap, violation, keywords]}
              label: {type: string}
    ResultLabels:
      type: object
      description: |
        Подписи для экранов HR: по id из документа версии — название этапа, факта, предмета, типа хода, финала.
        Нужны наблюдателю, у которого нет доступа к документу версии (`getVersion` — только методолог и администратор).
      required: [stages, facts, issues, moves, finals]
      properties:
        stages: {type: object, additionalProperties: {type: string}}
        facts: {type: object, additionalProperties: {type: string}}
        issues: {type: object, additionalProperties: {type: string}}
        moves: {type: object, additionalProperties: {type: string}}
        finals: {type: object, additionalProperties: {type: string}}
    Mark:
      type: object
      description: Пометка под шапкой результата (arena-scoring 12.1) — с пояснением одной строкой.
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [training, simplified, opponent_violations, lucky, demo, stub, abandoned, ended_by_participant,
                 turn_limit, time_limit, connection_lost, short_session, unconfirmed_violation, judge_attempts,
                 process_not_received, too_short]
        text: {type: string, example: "Тренировка — не основание для кадрового решения"}
        replies: {type: array, items: {type: integer}, description: Номера реплик, к которым ведёт пометка.}
    SessionHeader:
      type: object
      required: [session_id, scenario_title, version_number, difficulty, mode, started_at, status, participant_turns]
      properties:
        session_id: {type: string, format: uuid}
        scenario_id: {type: string, format: uuid}
        scenario_title: {type: string}
        version_number: {type: integer}
        fingerprint: {type: string}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        mode: {$ref: '#/components/schemas/Mode'}
        started_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        duration_ms: {type: [integer, 'null']}
        participant_turns: {type: integer}
        status: {$ref: '#/components/schemas/SessionStatus'}
        scoring_profile: {oneOf: [{$ref: '#/components/schemas/ScoringProfile'}, {type: 'null'}]}
        criteria_set: {type: string}
        is_demo: {type: boolean}
    ScoreColumns:
      type: object
      description: Две оценки отдельными полями; общего числа нет и не будет (FR-RS-04).
      properties:
        result_rank: {oneOf: [{$ref: '#/components/schemas/FinalRank'}, {type: 'null'}]}
        final_id: {type: [string, 'null']}
        final_title: {type: [string, 'null'], description: Буква всегда показывается вместе с названием финала.}
        result_number: {type: [integer, 'null'], minimum: 0, maximum: 100}
        result_max: {type: [integer, 'null']}
        process_status: {$ref: '#/components/schemas/ProcessStatus'}
        process_number: {type: [integer, 'null'], minimum: 0, maximum: 100}
        criteria_bands:
          type: [object, 'null']
          description: "`{\"diagnosis\": 4, …}` — полосы 0–4."
          additionalProperties: {type: integer, minimum: 0, maximum: 4}
        lucky: {type: boolean}
    ParticipantResult:
      type: object
      description: |
        Вид для участника (arena-scoring 12.3). `scores` — блок оценок, из которого портал убрал пределы оппонента,
        баллы предметов, отброшенные, найденные-но-не-засчитанные и упущенные эпизоды, неподтверждённые нарушения
        и нераскрытые скрытые предметы. Таблица предметов — в `issues`; нераскрытые скрытые предметы в неё
        не попадают, их число — в `hidden_unrevealed` («одно условие осталось невыясненным»). В транскрипте
        участника нет `stage`.
      required: [header, marks, score_columns, issues, hidden_unrevealed, transcript, objections]
      properties:
        header: {$ref: '#/components/schemas/SessionHeader'}
        marks: {type: array, items: {$ref: '#/components/schemas/Mark'}}
        score_columns: {$ref: '#/components/schemas/ScoreColumns'}
        issues:
          type: array
          description: Таблица по предметам для участника — без балла и формулы (arena-scoring 12.1).
          items: {$ref: '#/components/schemas/ParticipantIssueRow'}
        hidden_unrevealed: {type: integer, minimum: 0, description: Сколько скрытых предметов осталось невыясненными.}
        epilogue: {type: [string, 'null']}
        scores: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
        summary:
          type: array
          description: Пункты резюме, прошедшие проверку; пусто — «Резюме не сформировано».
          items: {$ref: '#/components/schemas/SummaryItem'}
        transcript: {type: array, items: {$ref: '#/components/schemas/TranscriptLine'}}
        objections: {type: array, items: {$ref: '#/components/schemas/ParticipantObjection'}}
        can_retry_judge: {type: boolean, description: Показывать ли кнопку «Повторить» у «процесса».}
    ParticipantIssueRow:
      type: object
      required: [issue_id, label, deal_value, target, limit]
      properties:
        issue_id: {type: string}
        label: {type: string}
        unit: {type: [string, 'null']}
        deal_value:
          description: Условие сделки; `null` — сделки нет.
          type: [string, number, 'null']
        target:
          description: Цель участника (для варианта из сделки; без сделки — из последнего предложения оппонента).
          type: [string, number, 'null']
        limit:
          description: Предел участника — по тому же правилу.
          type: [string, number, 'null']
        deal_reply_no: {type: [integer, 'null'], description: Реплика оппонента, где это условие появилось в предложении.}
        not_scored_note: {type: [string, 'null'], example: "отдельно не оценивается: от него зависит предел цены"}
    SummaryItem:
      type: object
      required: [kind, observation, reply, quote, instead]
      properties:
        kind: {type: string, enum: [strength, miss]}
        observation: {type: string}
        reply: {type: integer}
        speaker: {$ref: '#/components/schemas/Speaker'}
        quote: {type: string}
        at_ms: {type: integer}
        instead: {type: string}
    ParticipantResultList:
      type: object
      required: [attempts, progress]
      properties:
        attempts:
          type: array
          items:
            type: object
            required: [session_id, header, score_columns, marks]
            properties:
              session_id: {type: string, format: uuid}
              header: {$ref: '#/components/schemas/SessionHeader'}
              score_columns: {$ref: '#/components/schemas/ScoreColumns'}
              marks: {type: array, items: {$ref: '#/components/schemas/Mark'}}
              has_objection: {type: boolean}
        progress:
          type: array
          items: {$ref: '#/components/schemas/ProgressLine'}
    ProgressLine:
      type: object
      description: Одна линия — одна пара «версия сценария + уровень» при одном наборе критериев (FR-RS-12). Разные условия на одну линию не попадают.
      required: [scenario_version_id, scenario_title, version_number, difficulty, criteria_set, points, sample]
      properties:
        scenario_version_id: {type: string, format: uuid}
        scenario_title: {type: string}
        version_number: {type: integer}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        criteria_set: {type: string}
        mode: {$ref: '#/components/schemas/Mode'}
        points:
          type: array
          items:
            type: object
            required: [session_id, started_at]
            properties:
              session_id: {type: string, format: uuid}
              started_at: {type: string, format: date-time}
              result_rank: {oneOf: [{$ref: '#/components/schemas/FinalRank'}, {type: 'null'}]}
              result_number: {type: [integer, 'null']}
              process_number: {type: [integer, 'null']}
              criteria_bands: {type: [object, 'null'], additionalProperties: {type: integer}}
              simplified: {type: boolean}
              opponent_violations: {type: boolean}
        criteria_without_growth:
          type: array
          description: Критерии без роста за последние три попытки.
          items: {$ref: '#/components/schemas/Criterion'}
        sample: {$ref: '#/components/schemas/SmallSample'}
    ObjectionCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        target: {$ref: '#/components/schemas/ObjectionTarget'}
    ObjectionTarget:
      type: [object, 'null']
      description: К чему относится — оценка, критерий, эпизод, реплика или пункт резюме.
      properties:
        kind: {type: string, enum: [result, process, criterion, episode, reply, summary]}
        criterion: {oneOf: [{$ref: '#/components/schemas/Criterion'}, {type: 'null'}]}
        reply_no: {type: [integer, 'null']}
        indicator: {type: [string, 'null']}
        summary_index: {type: [integer, 'null']}
    ParticipantObjection:
      type: object
      required: [id, text, submitted_at]
      properties:
        id: {type: string, format: uuid}
        text: {type: string}
        target: {$ref: '#/components/schemas/ObjectionTarget'}
        submitted_at: {type: string, format: date-time}
        response:
          type: [object, 'null']
          properties:
            text: {type: string}
            responded_at: {type: string, format: date-time}

    # ------------------------------------------------------------------
    # Портал — вход и пользователи
    # ------------------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: {type: string, pattern: '^[a-z0-9._-]{3,64}$', description: "Логин из `portal_users.login`."}
        password: {type: string, minLength: 1, maxLength: 256}
    Me:
      type: object
      required: [user, demo_mode]
      properties:
        user: {$ref: '#/components/schemas/PortalUser'}
        demo_mode: {type: boolean}
    PortalUser:
      type: object
      required: [id, login, full_name, role, is_active, group_ids]
      properties:
        id: {type: string, format: uuid}
        login: {type: string}
        full_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        is_active: {type: boolean}
        group_ids: {type: array, items: {type: string, format: uuid}, description: Группы с доступом к результатам.}
        last_login_at: {type: [string, 'null'], format: date-time}
    UserCreate:
      type: object
      additionalProperties: false
      required: [login, full_name, role, password]
      properties:
        login: {type: string, pattern: '^[a-z0-9._-]{3,64}$'}
        full_name: {type: string, minLength: 1}
        role: {$ref: '#/components/schemas/Role'}
        password: {type: string, minLength: 10, maxLength: 256}
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        full_name: {type: string, minLength: 1}
        role: {$ref: '#/components/schemas/Role'}
        is_active: {type: boolean}
        new_password: {type: string, minLength: 10, maxLength: 256}
    GroupAccessPut:
      type: object
      additionalProperties: false
      required: [group_ids]
      properties:
        group_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}

    # ------------------------------------------------------------------
    # Сценарии
    # ------------------------------------------------------------------
    ScenarioListItem:
      type: object
      description: |
        Название, сфера, тип и теги читаются из паспорта черновика (`draft_document->'passport'`); у сценария,
        который ещё генерируется из брифа и черновика не имеет, — из анкеты: название — тема, тип — если указан.
      required: [id, slug, title, mode, origin, sphere, negotiation_type, tags, status]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, description: "`passport.id`; не уникален — импорт на тот же портал даёт второй сценарий с тем же id."}
        title: {type: string}
        mode: {$ref: '#/components/schemas/Mode'}
        origin: {$ref: '#/components/schemas/Origin'}
        sphere: {$ref: '#/components/schemas/Sphere'}
        negotiation_type: {oneOf: [{$ref: '#/components/schemas/NegotiationType'}, {type: 'null'}]}
        tags: {type: array, items: {type: string}}
        status: {type: string, enum: [draft, published, archived]}
        latest_version: {oneOf: [{$ref: '#/components/schemas/VersionSummary'}, {type: 'null'}]}
        draft_differs: {type: boolean, description: В черновике есть изменения, которых нет в последней версии.}
        blocking_errors: {type: integer, description: Число блокирующих ошибок проверки черновика.}
        generating: {type: boolean, description: Идёт генерация из брифа.}
    ScenarioPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScenarioListItem'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    ScenarioCard:
      allOf:
        - $ref: '#/components/schemas/ScenarioListItem'
        - type: object
          properties:
            mode_locked: {type: boolean, description: У сценария есть опубликованная версия — режим не меняется (FR-MD-01).}
            admission: {$ref: '#/components/schemas/Admission'}
            versions_count: {type: integer}
            archived_at: {type: [string, 'null'], format: date-time}
            copied_from:
              type: [object, 'null']
              properties:
                scenario_id: {type: string, format: uuid}
                version: {type: integer}
            created_at: {type: string, format: date-time}
            created_by_name: {type: string}
    Admission:
      type: object
      description: Допуск к оценке (FR-SC-11) — репетиции с загруженной записью на текущем отпечатке черновика.
      required: [fingerprint, done, required]
      properties:
        fingerprint: {type: [string, 'null']}
        done: {type: integer}
        required: {type: integer}
        reset: {type: boolean, description: Сохранение только что сменило отпечаток, и счётчик начался заново.}
    CreateScenarioRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateFromBrief'
        - $ref: '#/components/schemas/CreateFromTemplate'
        - $ref: '#/components/schemas/CreateCopy'
        - $ref: '#/components/schemas/CreateManual'
      discriminator:
        propertyName: origin
        mapping:
          brief: '#/components/schemas/CreateFromBrief'
          template: '#/components/schemas/CreateFromTemplate'
          copy: '#/components/schemas/CreateCopy'
          manual: '#/components/schemas/CreateManual'
    CreateFromBrief:
      type: object
      additionalProperties: false
      required: [origin, mode, questionnaire]
      properties:
        origin: {const: brief}
        mode: {$ref: '#/components/schemas/Mode'}
        questionnaire: {$ref: '#/components/schemas/Questionnaire'}
    Questionnaire:
      type: object
      additionalProperties: false
      description: Анкета из десяти полей (FR-SC-03); обязательны сфера и тема. Хранится в `authoring.questionnaire`.
      required: [sphere, topic]
      properties:
        sphere: {$ref: '#/components/schemas/Sphere'}
        topic: {type: string, minLength: 1, maxLength: 300}
        opponent_role: {type: string, maxLength: 1000}
        opponent_goals: {type: string, maxLength: 1000}
        participant_role: {type: string, maxLength: 1000}
        negotiation_type: {$ref: '#/components/schemas/NegotiationType'}
        opponent_character: {type: string, maxLength: 1000}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        time_limit_minutes: {type: integer, minimum: 3, maximum: 60}
        comment: {type: string, maxLength: 2000}
    CreateFromTemplate:
      type: object
      additionalProperties: false
      required: [origin, mode, template_id]
      properties:
        origin: {const: template}
        mode: {$ref: '#/components/schemas/Mode'}
        template_id: {type: string, example: internal_promotion}
        title: {type: string}
    CreateCopy:
      type: object
      additionalProperties: false
      required: [origin, mode, source_scenario_id, title]
      properties:
        origin: {const: copy}
        mode: {$ref: '#/components/schemas/Mode'}
        source_scenario_id: {type: string, format: uuid}
        source_version: {type: [integer, 'null'], description: Пусто — последняя опубликованная (или черновик, если версий нет).}
        title: {type: string, minLength: 1}
    CreateManual:
      type: object
      additionalProperties: false
      required: [origin, mode]
      properties:
        origin: {const: manual}
        mode: {$ref: '#/components/schemas/Mode'}
        title: {type: string}
    ArchiveRequest:
      type: object
      additionalProperties: false
      required: [archived]
      properties:
        archived: {type: boolean, description: true — в архив, false — вернуть из архива.}
    ScenarioTemplate:
      type: object
      required: [id, title, description, sphere, main_weights]
      properties:
        id: {type: string}
        title: {type: string, example: Внутреннее повышение}
        description: {type: string}
        sphere: {$ref: '#/components/schemas/Sphere'}
        main_weights:
          type: array
          items:
            type: object
            properties:
              evidence: {type: string, example: precedent}
              label: {type: string, example: Прецедент}
              weight: {type: number}
    Draft:
      type: object
      required: [scenario_id, document, fingerprint, check, admission, updated_at]
      properties:
        scenario_id: {type: string, format: uuid}
        document: {$ref: '#/components/schemas/ScenarioDocument'}
        fingerprint: {type: string}
        check: {$ref: '#/components/schemas/CheckResult'}
        admission: {$ref: '#/components/schemas/Admission'}
        updated_at: {type: string, format: date-time}
        updated_by_name: {type: [string, 'null']}
    DraftSave:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: {$ref: '#/components/schemas/ScenarioDocument'}
    CheckResult:
      type: object
      description: Результат проверки сценария (форма пакета движка; раздел 17 формата).
      required: [blocking, messages, engine_version]
      properties:
        blocking: {type: integer, description: Число блокирующих ошибок; 0 — можно публиковать.}
        engine_version: {type: string}
        messages: {type: array, items: {$ref: '#/components/schemas/CheckMessage'}}
    CheckMessage:
      type: object
      required: [severity, message, path]
      properties:
        rule: {type: string, description: Номер правила проверки — только для разработчика, на экран не выводится.}
        severity: {type: string, enum: [blocking, warning]}
        message: {type: string, example: "Сергей никогда не обидится — вы не описали, что его задевает"}
        path: {type: string, description: JSON Pointer к полю, которое надо поправить (FR-SC-07).}
        difficulty: {oneOf: [{$ref: '#/components/schemas/Difficulty'}, {type: 'null'}]}
        stage_ids: {type: array, items: {type: string}, description: Что подсветить на схеме.}
    DryRunCheck:
      type: object
      required: [check, fingerprint, resets_admission]
      properties:
        check: {$ref: '#/components/schemas/CheckResult'}
        fingerprint: {type: string}
        resets_admission: {type: boolean}
    PublishRequest:
      type: object
      additionalProperties: false
      required: [fingerprint]
      properties:
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
    VersionSummary:
      type: object
      required: [id, number, fingerprint, mode, published_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer}
        fingerprint: {type: string}
        mode: {$ref: '#/components/schemas/Mode'}
        title: {type: string}
        engine_version: {type: string}
        admission_rehearsals: {type: [integer, 'null']}
        admission_required: {type: [integer, 'null']}
        published_at: {type: string, format: date-time}
        published_by_name: {type: string}
        sessions_count: {type: integer}
    Version:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [document]
          properties:
            document: {$ref: '#/components/schemas/ScenarioDocument'}

    # ------------------------------------------------------------------
    # Генерация
    # ------------------------------------------------------------------
    GenerationState:
      type: object
      required: [scenario_id, questionnaire, step, status, confirmed_steps]
      properties:
        scenario_id: {type: string, format: uuid}
        questionnaire: {$ref: '#/components/schemas/Questionnaire'}
        step: {type: integer, enum: [1, 2, 3]}
        status: {type: string, enum: [running, ready, failed, done]}
        progress_text: {type: [string, 'null'], example: "Пишем карточку оппонента…"}
        confirmed_steps: {type: array, items: {type: integer}}
        result:
          oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]
          description: Поля текущего шага (формат, раздел 18) для проверки человеком.
        check: {oneOf: [{$ref: '#/components/schemas/CheckResult'}, {type: 'null'}]}
        error:
          type: [object, 'null']
          properties:
            message: {type: string, example: "Модель не ответила за 60 секунд. Анкета сохранена."}
            retry_after_seconds: {type: [integer, 'null']}
    GenerationConfirm:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields: {$ref: '#/components/schemas/EngineObject'}
    GenerationRegenerate:
      type: object
      additionalProperties: false
      properties:
        questionnaire: {$ref: '#/components/schemas/Questionnaire'}
        comment: {type: string, maxLength: 1000, description: Что поправить при повторе — идёт модели.}

    # ------------------------------------------------------------------
    # Репетиции
    # ------------------------------------------------------------------
    RehearsalStatus:
      type: string
      enum: [link_issued, running, uploaded, expired]
      description: |
        link_issued — ссылка выдана, тренажёр её ещё не открыл; running — ссылка погашена, запись не загружена;
        uploaded — запись загружена; expired — ссылку не открыли за 30 минут или запись не пришла за 12 часов
        после погашения. Выводится из столбцов `rehearsals`, отдельно не хранится.
    RehearsalCreate:
      type: object
      additionalProperties: false
      required: [difficulty]
      properties:
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        trainer_profile_id: {type: [string, 'null'], format: uuid, description: Пусто — профиль по умолчанию.}
    RehearsalLink:
      type: object
      description: Ответ на «Репетировать». Ключей нет (FR-PF-04).
      required: [rehearsal_id, link, expires_at, fingerprint, difficulty, trainer_profile_id]
      properties:
        rehearsal_id: {type: string, format: uuid}
        link:
          type: string
          format: uri
          description: Адрес тренажёра с токеном после `#`. Показывается один раз — повторно не выдаётся.
          example: "https://trainer.example/#rehearsal=q3F9…"
        expires_at: {type: string, format: date-time, description: Через 30 минут после выдачи.}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        trainer_profile_id: {type: string, format: uuid}
        trainer_profile_name: {type: string}
    RehearsalRedeemRequest:
      type: object
      additionalProperties: false
      required: [link_token]
      properties:
        link_token: {type: string, minLength: 32, maxLength: 128, description: Токен из ссылки — часть после `#rehearsal=`.}
    RehearsalRedeemResponse:
      type: object
      description: |
        Всё для репетиции, как при старте сессии, но документ целиком: методолог — автор сценария. Только в память
        тренажёра, не на диск и не в логи.
      required: [token, token_expires_at, rehearsal, format, engine_version, document, profile, model_access]
      properties:
        token: {type: string, description: Токен репетиции — только для загрузки записи этой репетиции; 12 часов.}
        token_expires_at: {type: string, format: date-time}
        rehearsal:
          type: object
          required: [id, scenario_id, fingerprint, difficulty]
          properties:
            id: {type: string, format: uuid}
            scenario_id: {type: string, format: uuid}
            fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
            difficulty: {$ref: '#/components/schemas/Difficulty'}
            run_by_name: {type: string}
        format: {type: string, example: arena-scenario/1, description: "Незнакомый номер — тренажёр не начинает и просит обновиться."}
        engine_version: {type: string, example: 1.4.0}
        document: {$ref: '#/components/schemas/ScenarioDocument'}
        profile: {$ref: '#/components/schemas/TrainerProfileForClient'}
        model_access: {$ref: '#/components/schemas/ModelAccess'}
    RehearsalStep:
      type: object
      additionalProperties: false
      description: |
        Разбор одной реплики по шагам (FR-SC-10): быстрые проверки → судья участника → сила довода → очки доводов →
        доверие, терпение, цена → переход → указание оппоненту → запрос к оппоненту и ответ → судья оппонента.
        В отличие от `engine_step` сессии — с текстом запроса к оппоненту.
      required: [reply_no, breakdown]
      properties:
        reply_no: {type: integer, minimum: 0}
        breakdown: {$ref: '#/components/schemas/EngineObject'}
        model_errors:
          type: array
          description: Какая модель не ответила и почему — обычными словами, без ключа в тексте.
          items:
            type: object
            additionalProperties: false
            required: [model, message]
            properties:
              model: {type: string, enum: [opponent, participant_judge, opponent_judge]}
              message: {type: string, maxLength: 500, example: "Судья оппонента: ключ отклонён сервисом (401)"}
    RehearsalRecordUpload:
      type: object
      additionalProperties: false
      description: |
        Запись репетиции от тренажёра. Реплики, отказы компонентов, финал и ответ судьи — в тех же формах, что
        события и завершение сессии (`TurnEvent`, `IncidentEvent`, `FinishRequest`).
      required: [fingerprint, engine_version, status, turns, steps, judge_attempts]
      properties:
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$', description: Отпечаток документа, на котором шёл разговор; равен отпечатку ссылки.}
        engine_version: {type: string}
        status: {$ref: '#/components/schemas/ClosingStatus'}
        final_id: {type: [string, 'null']}
        break_stage: {type: [string, 'null']}
        break_turn: {type: [integer, 'null']}
        turns:
          type: array
          maxItems: 400
          items: {$ref: '#/components/schemas/TurnEvent'}
        incidents:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/IncidentEvent'}
        steps:
          type: array
          description: Разбор каждой реплики, по порядку.
          items: {$ref: '#/components/schemas/RehearsalStep'}
        judge_answer:
          oneOf: [{$ref: '#/components/schemas/JudgeAnswer'}, {type: 'null'}]
        judge_attempts: {type: integer, minimum: 0}
        client_scores:
          oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]
          description: Расчёт тренажёра — только для сверки; показывается расчёт портала.
    Rehearsal:
      type: object
      required: [id, scenario_id, fingerprint, difficulty, trainer_profile_id, status, issued_at, counts_for_admission]
      properties:
        id: {type: string, format: uuid}
        scenario_id: {type: string, format: uuid}
        fingerprint: {type: string}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        trainer_profile_id: {type: string, format: uuid}
        trainer_profile_name: {type: string}
        profile_revision: {type: [integer, 'null'], description: Ревизия профиля на момент погашения ссылки.}
        status: {$ref: '#/components/schemas/RehearsalStatus'}
        run_by_name: {type: string, description: Кто получил ссылку и репетировал.}
        issued_at: {type: string, format: date-time}
        link_expires_at: {type: string, format: date-time}
        redeemed_at: {type: [string, 'null'], format: date-time}
        uploaded_at: {type: [string, 'null'], format: date-time}
        engine_version: {type: [string, 'null']}
        counts_for_admission: {type: boolean, description: "`rehearsals.counts_for_admission`: запись загружена — репетиция идёт в допуск своего отпечатка."}
        final_id: {type: [string, 'null']}
        result_rank: {oneOf: [{$ref: '#/components/schemas/FinalRank'}, {type: 'null'}]}
        result:
          oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]
          description: Обе оценки по отдельности, пересчёт портала (FR-RS-04).
        record:
          oneOf: [{$ref: '#/components/schemas/RehearsalRecordUpload'}, {type: 'null'}]
          description: Запись, как её загрузил тренажёр; до загрузки — null.
    RehearsalList:
      type: object
      required: [items, admission]
      properties:
        admission: {$ref: '#/components/schemas/Admission'}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              fingerprint: {type: string}
              difficulty: {$ref: '#/components/schemas/Difficulty'}
              trainer_profile_name: {type: string}
              status: {$ref: '#/components/schemas/RehearsalStatus'}
              run_by_name: {type: string}
              issued_at: {type: string, format: date-time}
              uploaded_at: {type: [string, 'null'], format: date-time}
              result_rank: {oneOf: [{$ref: '#/components/schemas/FinalRank'}, {type: 'null'}]}
              counts_for_admission: {type: boolean}

    # ------------------------------------------------------------------
    # Здоровье
    # ------------------------------------------------------------------
    ScenarioHealth:
      type: object
      required: [scenario_version_id, sample, labels]
      properties:
        scenario_version_id: {type: string, format: uuid}
        sample: {$ref: '#/components/schemas/SmallSample'}
        labels: {$ref: '#/components/schemas/ResultLabels'}
        running_now: {type: integer}
        by_status:
          type: object
          description: Число сессий по статусам; сумма плюс идущие — число начатых (FR-ST-03).
          additionalProperties: {type: integer}
        finals:
          type: array
          items:
            type: object
            properties:
              final_id: {type: string}
              final_title: {type: string}
              result_rank: {$ref: '#/components/schemas/FinalRank'}
              n: {type: integer}
        stages_never_reached:
          type: array
          items:
            type: object
            properties:
              stage_id: {type: string}
              title: {type: string}
        facts_never_found:
          type: array
          items:
            type: object
            properties:
              fact_id: {type: string}
              label: {type: string}
        avg_participant_turns: {type: [number, 'null']}
        breaks:
          type: object
          properties:
            share: {type: number}
            points:
              type: array
              items:
                type: object
                properties:
                  stage: {type: string}
                  n: {type: integer}
        by_difficulty:
          type: array
          items:
            type: object
            properties:
              difficulty: {$ref: '#/components/schemas/Difficulty'}
              sample: {$ref: '#/components/schemas/SmallSample'}
              ranks: {type: object, additionalProperties: {type: integer}}
        opponent_violations:
          type: object
          properties:
            sessions_share: {type: number}
            by_kind: {type: object, additionalProperties: {type: integer}}
        empty_note: {type: [string, 'null'], example: "Сессий по этой версии ещё нет — данные появятся после первых прохождений."}
    HealthSessionItem:
      type: object
      required: [session_id, started_at, difficulty, status, full_access]
      properties:
        session_id: {type: string, format: uuid}
        started_at: {type: string, format: date-time}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        status: {$ref: '#/components/schemas/SessionStatus'}
        final_title: {type: [string, 'null']}
        result_rank: {oneOf: [{$ref: '#/components/schemas/FinalRank'}, {type: 'null'}]}
        break_stage: {type: [string, 'null']}
        opponent_violation_count: {type: integer}
        full_access: {type: boolean}
    HealthSessionPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/HealthSessionItem'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    ReducedSession:
      type: object
      description: FR-ST-02. Нет имени, номера участника, группы, текстов и цитат.
      required: [session_id, scenario_version_id, difficulty, status, labels, turns]
      properties:
        session_id: {type: string, format: uuid}
        scenario_version_id: {type: string, format: uuid}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        status: {$ref: '#/components/schemas/SessionStatus'}
        labels: {$ref: '#/components/schemas/ResultLabels'}
        final_title: {type: [string, 'null']}
        final_condition_text: {type: [string, 'null'], description: Условие финала обычной фразой (формат, 12).}
        result_rank: {oneOf: [{$ref: '#/components/schemas/FinalRank'}, {type: 'null'}]}
        break_stage: {type: [string, 'null']}
        turns:
          type: array
          items:
            type: object
            properties:
              reply_no: {type: integer}
              speaker: {$ref: '#/components/schemas/Speaker'}
              stage: {type: string}
              transition_to: {type: [string, 'null']}
              move_type: {type: [string, 'null']}
              offer: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
              revealed_facts: {type: array, items: {type: string}}
              interrupted: {type: boolean}
              opponent_violation_kinds: {type: array, items: {type: string}}

    # ------------------------------------------------------------------
    # Назначения
    # ------------------------------------------------------------------
    PersonRef:
      type: object
      description: Сотрудник на экранах HR. После отзыва согласия `display_name = null` — виден только номер.
      required: [subject_id, number]
      properties:
        subject_id: {type: string, format: uuid}
        number: {type: string}
        display_name: {type: [string, 'null']}
        is_pseudonym: {type: boolean}
    Assignment:
      type: object
      required: [id, person, group_id, scenario_id, scenario_version_id, version_number, mode, difficulty, trainer_profile_id, due_at, status]
      properties:
        id: {type: string, format: uuid}
        person: {$ref: '#/components/schemas/PersonRef'}
        group_id: {type: string, format: uuid}
        scenario_id: {type: string, format: uuid}
        scenario_title: {type: string}
        scenario_version_id: {type: string, format: uuid}
        version_number: {type: integer}
        newer_version_exists: {type: boolean}
        mode: {$ref: '#/components/schemas/Mode'}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        trainer_profile_id: {type: string, format: uuid}
        trainer_profile_name: {type: string}
        due_at: {type: string, format: date-time}
        batch_id: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        last_attempt_at: {type: [string, 'null'], format: date-time}
        attempts: {type: integer}
        break_point:
          type: [object, 'null']
          properties:
            stage: {type: string}
            turn: {type: integer}
        code:
          type: object
          description: Сам код не хранится и не возвращается — только состояние.
          properties:
            issued_at: {type: string, format: date-time}
            failed_attempts: {type: integer}
            blocked_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        created_by_name: {type: string}
        cancelled_at: {type: [string, 'null'], format: date-time}
        cancel_reason: {type: [string, 'null'], enum: [by_hr, consent_withdrawn, null]}
        running_session_at_cancel: {type: boolean}
    AssignmentPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    AssignmentCreate:
      type: object
      additionalProperties: false
      required: [subject_ids, scenario_version_id, difficulty, due_at]
      properties:
        subject_ids: {type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: {type: string, format: uuid}}
        scenario_version_id: {type: string, format: uuid}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        trainer_profile_id: {type: [string, 'null'], format: uuid}
        due_at: {type: string, format: date-time}
    IssuedCode:
      type: object
      required: [assignment_id, person, code, link]
      properties:
        assignment_id: {type: string, format: uuid}
        person: {$ref: '#/components/schemas/PersonRef'}
        code: {type: string, example: ARENA-7K3Q-9DXM-2PA}
        link: {type: string, format: uri, example: "https://arena.example/t?code=ARENA-7K3Q-9DXM-2PA"}
    AssignmentCreateResult:
      type: object
      description: Коды показываются один раз; CSV «сотрудник — код — ссылка» строит браузер из этого ответа.
      required: [created, skipped]
      properties:
        batch_id: {type: [string, 'null'], format: uuid}
        created: {type: array, items: {$ref: '#/components/schemas/IssuedCode'}}
        skipped:
          type: array
          items:
            type: object
            required: [subject_id, reason]
            properties:
              subject_id: {type: string, format: uuid}
              assignment_id: {type: [string, 'null'], format: uuid}
              reason: {type: string, example: "не назначено — нет ФИО"}
    ReissueRequest:
      type: object
      additionalProperties: false
      required: [assignment_ids]
      properties:
        assignment_ids: {type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: {type: string, format: uuid}}
    AssignmentPatch:
      type: object
      additionalProperties: false
      required: [due_at]
      properties:
        due_at: {type: string, format: date-time}

    # ------------------------------------------------------------------
    # Группы и сотрудники
    # ------------------------------------------------------------------
    Group:
      type: object
      required: [id, name, has_access]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        department: {type: [string, 'null']}
        trainer_profile_id: {type: [string, 'null'], format: uuid}
        trainer_profile_name: {type: string, description: Профиль группы или «Профиль по умолчанию».}
        people_count: {type: integer}
        has_access: {type: boolean}
        archived_at: {type: [string, 'null'], format: date-time}
    GroupWrite:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        department: {type: [string, 'null'], maxLength: 200}
        trainer_profile_id: {type: [string, 'null'], format: uuid}
        archived: {type: boolean}
    Person:
      type: object
      required: [subject_id, number, group_id]
      properties:
        subject_id: {type: string, format: uuid}
        number: {type: string}
        group_id: {type: string, format: uuid}
        group_name: {type: string}
        full_name: {type: [string, 'null']}
        pseudonym: {type: [string, 'null']}
        personnel_no: {type: [string, 'null']}
        job_title: {type: [string, 'null']}
        external_ai_withdrawn_at: {type: [string, 'null'], format: date-time}
        written_consent_valid_until: {type: [string, 'null'], format: date}
        code_blocked: {type: boolean}
    PersonWrite:
      type: object
      additionalProperties: false
      properties:
        group_id: {type: string, format: uuid}
        full_name: {type: [string, 'null'], maxLength: 300}
        pseudonym: {type: [string, 'null'], maxLength: 100}
        personnel_no: {type: [string, 'null'], maxLength: 50}
        job_title: {type: [string, 'null'], maxLength: 200}
    PersonPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Person'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    PersonCard:
      type: object
      required: [person, assignments, consents, objections, decisions, results_visible]
      properties:
        person: {$ref: '#/components/schemas/Person'}
        results_visible: {type: boolean, description: Есть ли доступ к группам его сессий.}
        attempts_total: {type: integer}
        assignments: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        consents: {type: array, items: {$ref: '#/components/schemas/ConsentRecord'}}
        objections: {type: array, items: {$ref: '#/components/schemas/Objection'}}
        decisions: {type: array, items: {$ref: '#/components/schemas/Decision'}}
    Progress:
      type: object
      required: [subject_id, lines]
      properties:
        subject_id: {type: string, format: uuid}
        lines: {type: array, items: {$ref: '#/components/schemas/ProgressLine'}}
    WrittenConsentCreate:
      type: object
      additionalProperties: false
      required: [document_ref, document_channel, signed_on]
      properties:
        document_ref: {type: string, minLength: 1, maxLength: 200}
        document_channel: {type: string, enum: [paper, edo]}
        signed_on: {type: string, format: date}
        valid_until: {type: [string, 'null'], format: date}
    ConsentWithdrawal:
      type: object
      additionalProperties: false
      required: [scope, document_ref]
      properties:
        scope: {type: string, enum: [all, external_ai]}
        document_ref: {type: string, minLength: 1, maxLength: 200, description: Дата и номер письменного отзыва.}
        confirm_name: {type: string, description: "Обязательно при `scope = all`; должно точно совпасть с ФИО, а если ФИО нет — с псевдонимом."}
    ConsentWithdrawalResult:
      type: object
      required: [scope, number]
      properties:
        scope: {type: string, enum: [all, external_ai]}
        number: {type: string}
        cancelled_assignments: {type: integer}
        running_session: {type: boolean}
        message: {type: string}

    # ------------------------------------------------------------------
    # Сессии
    # ------------------------------------------------------------------
    SessionFlags:
      type: object
      properties:
        training: {type: boolean}
        simplified: {type: boolean}
        opponent_violation_count: {type: integer}
        reviewed: {type: boolean}
        lucky: {type: boolean}
        stub_used: {type: boolean}
        has_objection: {type: boolean}
        reopened_count: {type: integer}
        judge_attempts: {type: integer}
    SessionListItem:
      type: object
      required: [session_id, person, group_id, header, score_columns, flags]
      properties:
        session_id: {type: string, format: uuid}
        person: {$ref: '#/components/schemas/PersonRef'}
        group_id: {type: string, format: uuid}
        assignment_id: {type: string, format: uuid}
        header: {$ref: '#/components/schemas/SessionHeader'}
        score_columns: {$ref: '#/components/schemas/ScoreColumns'}
        flags: {$ref: '#/components/schemas/SessionFlags'}
    SessionPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SessionListItem'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    Review:
      type: object
      required: [reviewed_at, reviewed_by_name, reviewed_violation_count]
      properties:
        reviewed_at: {type: string, format: date-time}
        reviewed_by_name: {type: string}
        reviewed_violation_count: {type: integer, description: Сколько нарушений было на момент отметки; если сейчас больше — нужна новая отметка.}
    SessionResult:
      type: object
      description: |
        «Сессия — результат» для HR (arena-scoring 12). `scores` — блок оценок в расчёте портала целиком
        (arena-scoring 9): предметы с баллами и пределом оппонента, эпизоды засчитанные и отброшенные с причиной,
        найденные-но-не-засчитанные, упущенные, потолки, неподтверждённые нарушения. Эпизоды ссылаются на номер
        реплики; цитата открывается по `transcript`.
      required: [header, person, marks, score_columns, flags, labels, transcript, objections, decisions]
      properties:
        header: {$ref: '#/components/schemas/SessionHeader'}
        person: {$ref: '#/components/schemas/PersonRef'}
        group_id: {type: string, format: uuid}
        marks: {type: array, items: {$ref: '#/components/schemas/Mark'}}
        score_columns: {$ref: '#/components/schemas/ScoreColumns'}
        flags: {$ref: '#/components/schemas/SessionFlags'}
        labels: {$ref: '#/components/schemas/ResultLabels'}
        final_condition_text: {type: [string, 'null'], description: Условие финала обычной фразой (формат, 12) — открывается по нажатию на букву.}
        epilogue: {type: [string, 'null']}
        scores: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
        scored_at: {type: [string, 'null'], format: date-time}
        summary: {type: array, items: {$ref: '#/components/schemas/SummaryItem'}}
        transcript: {type: array, items: {$ref: '#/components/schemas/TranscriptLine'}}
        opponent_violations:
          type: array
          items:
            type: object
            properties:
              reply_no: {type: integer}
              kinds: {type: array, items: {type: string, enum: [out_of_role, beyond_limit, early_fact, wrong_number]}}
              comment: {type: [string, 'null']}
              correction_reply_no: {type: [integer, 'null']}
        simplified_replies: {type: array, items: {type: integer}}
        review: {oneOf: [{$ref: '#/components/schemas/Review'}, {type: 'null'}]}
        review_needed: {type: boolean}
        objections: {type: array, items: {$ref: '#/components/schemas/Objection'}}
        decisions:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              decision: {type: string}
              decided_at: {type: string, format: date-time}
              decided_by_name: {type: string}
    TurnRecord:
      type: object
      description: Строка лога ходов для «Сессия — запись». Без текста запроса к оппоненту и без эмоций.
      allOf:
        - $ref: '#/components/schemas/TranscriptLine'
        - type: object
          properties:
            duration_ms: {type: [integer, 'null']}
            pause_ms: {type: [integer, 'null']}
            model_route: {oneOf: [{$ref: '#/components/schemas/ModelRoute'}, {type: 'null'}]}
            stage: {type: string}
            transition_to: {type: [string, 'null']}
            move_type: {type: [string, 'null']}
            move_source: {oneOf: [{$ref: '#/components/schemas/MoveSource'}, {type: 'null'}]}
            judge_confidence: {type: [number, 'null']}
            evidence: {type: [string, 'null']}
            interest: {type: [string, 'null']}
            violations: {type: array, items: {type: string}}
            judge: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
            terms: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
            trust: {type: [integer, 'null']}
            pressure: {type: [integer, 'null']}
            credibility: {type: [integer, 'null']}
            patience: {type: [integer, 'null']}
            credit: {type: [integer, 'null']}
            revealed_facts: {type: array, items: {type: string}}
            engine_step: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
            intent: {type: [string, 'null']}
            offer: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
            opponent_judge: {oneOf: [{$ref: '#/components/schemas/EngineObject'}, {type: 'null'}]}
            opponent_violation: {type: boolean}
            opponent_judge_comment: {type: [string, 'null']}
            interrupted: {type: boolean}
            received_at: {type: string, format: date-time}
    SessionRecord:
      type: object
      required: [header, person, labels, turns, conditions]
      properties:
        header: {$ref: '#/components/schemas/SessionHeader'}
        person: {$ref: '#/components/schemas/PersonRef'}
        labels: {$ref: '#/components/schemas/ResultLabels'}
        final_condition_text: {type: [string, 'null']}
        turns: {type: array, items: {$ref: '#/components/schemas/TurnRecord'}}
        incidents: {type: array, items: {$ref: '#/components/schemas/IncidentEvent'}}
        conditions:
          type: object
          description: С чем прошла сессия (FR-RS-01, FR-PF-03).
          properties:
            scenario_version_id: {type: string, format: uuid}
            fingerprint: {type: string}
            engine_version: {type: string}
            criteria_set: {type: string}
            trainer_profile_id: {type: string, format: uuid}
            trainer_profile_name: {type: string}
            profile_revision: {type: integer}
            profile_snapshot: {$ref: '#/components/schemas/TrainerProfileSettings'}
            external_ai_allowed: {type: boolean}
            judge_attempts: {type: integer}
            reopened_count: {type: integer}
        audio_note: {type: string, example: "Голос в первой версии не записывается."}

    # ------------------------------------------------------------------
    # Аналитика и выгрузки
    # ------------------------------------------------------------------
    ComparisonCondition:
      type: object
      required: [mode, scenario_version_id, difficulty, criteria_set, scoring_profile, sessions_n]
      properties:
        mode: {$ref: '#/components/schemas/Mode'}
        scenario_id: {type: string, format: uuid}
        scenario_title: {type: string}
        scenario_version_id: {type: string, format: uuid}
        version_number: {type: integer}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        criteria_set: {type: string}
        scoring_profile: {$ref: '#/components/schemas/ScoringProfile'}
        sessions_n: {type: integer}
    ComparisonTable:
      type: object
      required: [complete, conditions, available_conditions, rows]
      properties:
        complete: {type: boolean, description: "false — условий не хватает или в выборке они разные: выберите из `available_conditions`."}
        conditions: {oneOf: [{$ref: '#/components/schemas/ComparisonCondition'}, {type: 'null'}]}
        available_conditions:
          type: array
          description: Сочетания равных условий в группе с числом сессий (при `complete = false`; иначе пусто).
          items: {$ref: '#/components/schemas/ComparisonCondition'}
        training_note: {type: [string, 'null'], example: "Тренировка — не основание для кадрового решения"}
        sample: {oneOf: [{$ref: '#/components/schemas/SmallSample'}, {type: 'null'}]}
        simplified_excluded: {type: integer}
        sort: {type: string, enum: [result, process]}
        rows:
          type: array
          items:
            type: object
            required: [person, attempts, last_session_id, score_columns, flags]
            properties:
              person: {$ref: '#/components/schemas/PersonRef'}
              attempts: {type: integer}
              last_session_id: {type: string, format: uuid}
              score_columns: {$ref: '#/components/schemas/ScoreColumns'}
              flags: {$ref: '#/components/schemas/SessionFlags'}
    GroupAnalytics:
      type: object
      required: [group_id, group_name, sample, weak_criteria]
      properties:
        group_id: {type: string, format: uuid}
        group_name: {type: string}
        sample: {$ref: '#/components/schemas/SmallSample'}
        headline: {type: [string, 'null'], example: "Группа почти не опирается на объективные критерии"}
        weak_criteria:
          type: array
          description: По возрастанию средней полосы — первый самый слабый.
          items:
            type: object
            properties:
              criterion: {$ref: '#/components/schemas/Criterion'}
              label: {type: string}
              avg_band: {type: number}
              n: {type: integer}
        result_ranks: {type: object, additionalProperties: {type: integer}, description: "Распределение букв S–F."}
        result_numbers: {type: array, items: {type: integer}, description: "Гистограмма «результата» по 10 корзинам 0–9, 10–19, …"}
        process_numbers: {type: array, items: {type: integer}, description: "Гистограмма «процесса» по тем же корзинам."}
        empty_note: {type: [string, 'null'], example: "По этим условиям сессий нет"}
    CriterionSessionPage:
      type: object
      required: [items, page]
      properties:
        page: {$ref: '#/components/schemas/PageMeta'}
        items:
          type: array
          items:
            type: object
            properties:
              session_id: {type: string, format: uuid}
              person: {$ref: '#/components/schemas/PersonRef'}
              started_at: {type: string, format: date-time}
              band: {type: integer}
              example:
                type: [object, 'null']
                description: Пример из резюме или упущенного эпизода — с цитатой и номером реплики.
                properties:
                  reply_no: {type: integer}
                  quote: {type: string}
                  observation: {type: string}
    ExportFilters:
      type: object
      additionalProperties: false
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        group_ids: {type: array, items: {type: string, format: uuid}}
        subject_id: {type: string, format: uuid}
        scenario_id: {type: string, format: uuid}
        scenario_version_id: {type: string, format: uuid}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        mode: {$ref: '#/components/schemas/Mode'}
        statuses: {type: array, items: {$ref: '#/components/schemas/SessionStatus'}}
    ExportRequest:
      type: object
      additionalProperties: false
      required: [slice, table, format, filters]
      properties:
        slice: {type: string, enum: [group, employee, scenario], description: "Готовый срез FR-ST-07: по группе нужен `group_ids`, по сотруднику — `subject_id`, по сценарию — `scenario_id`."}
        table: {type: string, enum: [summary, turns], description: "summary — строка на сессию; turns — строка на реплику."}
        format: {type: string, enum: [csv, xlsx]}
        filters: {$ref: '#/components/schemas/ExportFilters'}
        dry_run: {type: boolean, default: false, description: "true — только посчитать: ответ `ExportPreview`, файла и записи в журнал нет."}
    ExportPreview:
      type: object
      required: [sessions, rows, groups]
      properties:
        sessions: {type: integer}
        rows: {type: integer}
        groups:
          type: array
          description: Какие группы попадут в выгрузку (без фильтра группы — все группы с доступом) и сколько строк от каждой — так же они лягут в журнал.
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              rows: {type: integer}

    # ------------------------------------------------------------------
    # Решения и возражения
    # ------------------------------------------------------------------
    DecisionCandidate:
      type: object
      required: [session, eligible, reasons]
      properties:
        session: {$ref: '#/components/schemas/SessionListItem'}
        eligible: {type: boolean}
        reasons:
          type: array
          description: Почему нельзя привязать.
          items: {type: string, example: "Оппонент нарушил правила — сначала проверьте сессию"}
        objections: {type: array, items: {$ref: '#/components/schemas/Objection'}}
    DecisionCreate:
      type: object
      additionalProperties: false
      required: [subject_id, decision, grounds, session_ids]
      properties:
        subject_id: {type: string, format: uuid}
        decision: {type: string, minLength: 1, maxLength: 500, example: "Перевод на должность ведущего специалиста по закупкам"}
        grounds: {type: string, minLength: 1, maxLength: 10000, pattern: '\p{L}', description: Собственные основания; хотя бы одна буква.}
        session_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        supersedes_id: {type: [string, 'null'], format: uuid}
    Decision:
      type: object
      required: [id, subject_id, decision, grounds, decided_at, decided_by_name, session_ids]
      properties:
        id: {type: string, format: uuid}
        subject_id: {type: string, format: uuid}
        person: {$ref: '#/components/schemas/PersonRef'}
        decision: {type: string}
        grounds: {type: string}
        decided_at: {type: string, format: date-time}
        decided_by_name: {type: string}
        session_ids: {type: array, items: {type: string, format: uuid}}
        supersedes_id: {type: [string, 'null'], format: uuid}
        superseded_by_id: {type: [string, 'null'], format: uuid}
        objections:
          type: array
          description: Возражения по привязанным сессиям — показываются и в записи решения (UC-H-12).
          items: {$ref: '#/components/schemas/Objection'}
    Objection:
      type: object
      required: [id, session_id, person, text, submitted_at, mode]
      properties:
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        person: {$ref: '#/components/schemas/PersonRef'}
        mode: {$ref: '#/components/schemas/Mode'}
        scenario_title: {type: string}
        text: {type: [string, 'null'], description: null — ключ участника уничтожен.}
        target: {$ref: '#/components/schemas/ObjectionTarget'}
        submitted_at: {type: string, format: date-time}
        response:
          type: [object, 'null']
          properties:
            text: {type: [string, 'null']}
            responded_at: {type: string, format: date-time}
            responded_by_name: {type: string}
        has_decision: {type: boolean}
    ObjectionPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Objection'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    ObjectionAnswer:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}

    # ------------------------------------------------------------------
    # Профили тренажёра
    # ------------------------------------------------------------------
    TrainerProfilePublic:
      type: object
      additionalProperties: false
      description: Вид для не-администратора (`trainer_profiles_public`) — ни ключей, ни их последних символов.
      required: [id, name, is_default, revision, settings, has_openrouter_key, has_model_server_token]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_default: {type: boolean}
        revision: {type: integer}
        settings: {$ref: '#/components/schemas/TrainerProfileSettings'}
        has_openrouter_key: {type: boolean}
        has_model_server_token: {type: boolean}
        archived_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    TrainerProfileAdmin:
      type: object
      additionalProperties: false
      description: |
        Вид для администратора. Описан целиком, а не через `allOf` от `TrainerProfilePublic`: у того закрыт набор
        полей. Обязательные `*_last4` отличают его от публичного вида, поэтому `oneOf` в `TrainerProfile` однозначен.
      required: [id, name, is_default, revision, settings, has_openrouter_key, has_model_server_token,
                 openrouter_key_last4, model_server_token_last4]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_default: {type: boolean}
        revision: {type: integer}
        settings: {$ref: '#/components/schemas/TrainerProfileSettings'}
        has_openrouter_key: {type: boolean}
        has_model_server_token: {type: boolean}
        archived_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
        openrouter_key_last4: {type: [string, 'null'], example: "…9f2c"}
        model_server_token_last4: {type: [string, 'null']}
        keys_changed_at: {type: [string, 'null'], format: date-time}
        keys_changed_by_name: {type: [string, 'null']}
        running_sessions: {type: integer, description: Сколько сессий по профилю идёт сейчас — изменения подействуют со следующего старта.}
        same_key_profiles:
          type: array
          description: Другие профили с теми же последними 4 символами ключа.
          items: {type: string, format: uuid}
    TrainerProfile:
      oneOf:
        - $ref: '#/components/schemas/TrainerProfilePublic'
        - $ref: '#/components/schemas/TrainerProfileAdmin'
      description: Администратор получает `TrainerProfileAdmin`, остальные — `TrainerProfilePublic`. Оба вида закрыты, поэтому ответ подходит ровно под один.
    TrainerProfileCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        copy_from: {type: [string, 'null'], format: uuid}
        settings: {$ref: '#/components/schemas/TrainerProfileSettings'}
    TrainerProfilePatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        settings: {$ref: '#/components/schemas/TrainerProfileSettings'}
    TrainerProfileKeys:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        openrouter_key: {type: [string, 'null'], minLength: 8, maxLength: 500, writeOnly: true}
        model_server_token: {type: [string, 'null'], minLength: 8, maxLength: 500, writeOnly: true}
    ProfileCheckResult:
      type: object
      required: [checked_at, rows]
      properties:
        checked_at: {type: string, format: date-time}
        rows:
          type: array
          items:
            type: object
            required: [target, ok]
            properties:
              target: {type: string, enum: [opponent, participant_judge, opponent_judge, tts]}
              route: {oneOf: [{$ref: '#/components/schemas/ModelRoute'}, {type: 'null'}]}
              ok: {type: boolean}
              latency_ms: {type: [integer, 'null']}
              slow: {type: boolean, description: Ответ дольше, чем укладывается в бюджет хода NFR-P-03.}
              message: {type: [string, 'null'], example: "Ключ отклонён сервисом OpenRouter"}

    # ------------------------------------------------------------------
    # Журнал и настройки
    # ------------------------------------------------------------------
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_kind, action, outcome]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        actor_kind: {type: string, enum: [user, participant, system]}
        actor_user_id: {type: [string, 'null'], format: uuid}
        actor_name: {type: [string, 'null']}
        action: {$ref: '#/components/schemas/AuditAction'}
        outcome: {type: string, enum: [ok, denied]}
        subject_number: {type: [string, 'null'], description: Участник — только номером.}
        session_id: {type: [string, 'null'], format: uuid}
        group_id: {type: [string, 'null'], format: uuid}
        group_name: {type: [string, 'null']}
        rows_count: {type: [integer, 'null']}
        details: {type: [object, 'null'], additionalProperties: true}
    AuditPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    AuditExportRequest:
      type: object
      additionalProperties: false
      description: Журнал выгружается только в CSV.
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        actor_user_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        subject_number: {type: string}
        action: {$ref: '#/components/schemas/AuditAction'}
    PortalSettings:
      type: object
      required: [demo_mode, admission_rehearsals, abandon_timeout_minutes, code_max_failed_attempts]
      properties:
        demo_mode: {type: boolean, readOnly: true, description: Из переменной окружения; в портале только показывается.}
        admission_rehearsals: {type: integer, minimum: 1, maximum: 20}
        abandon_timeout_minutes: {type: integer, minimum: 2, maximum: 120}
        code_max_failed_attempts: {type: integer, minimum: 3, maximum: 50}
        updated_at: {type: [string, 'null'], format: date-time}
        updated_by_name: {type: [string, 'null']}
    PortalSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        admission_rehearsals: {type: integer, minimum: 1, maximum: 20}
        abandon_timeout_minutes: {type: integer, minimum: 2, maximum: 120}
        code_max_failed_attempts: {type: integer, minimum: 3, maximum: 50}
