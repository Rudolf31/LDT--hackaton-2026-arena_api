        `admission.reset = true`. С `If-Match`, не совпавшим с текущим ETag, — 412.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-05, UC-M-06, UC-M-09, UC-A-10]
      x-fr: [FR-SC-05, FR-SC-06, FR-SC-07, FR-SC-08, FR-SC-11, FR-SC-15, FR-MD-01]
