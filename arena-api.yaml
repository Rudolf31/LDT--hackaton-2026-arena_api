  # =====================================================================
  # ПРОФИЛИ ТРЕНАЖЁРА
  # =====================================================================
  /api/portal/trainer-profiles:
    get:
      tags: ["Профили тренажёра"]
      operationId: listTrainerProfiles
      summary: "Профили тренажёра"
      description: |
        Не-администратору — вид без ключей и без последних символов, только «ключ задан да/нет»
        (представление `trainer_profiles_public`, FR-PF-04). Администратору — с последними 4 символами;
        `key_last4` находит профили с тем же ключом (UC-A-03). Фильтр `key_last4` от не-администратора — 403:
        иначе по составу ответа подбором узнаются последние символы ключа. Профиль по умолчанию — первым.
      x-roles: [methodologist, observer, admin]
      x-uc: [UC-A-01, UC-A-03, UC-A-04, UC-H-01, UC-M-08]
      x-fr: [FR-PF-01, FR-PF-04, FR-PF-05]
      security:
        - portalCookie: []
      parameters:
        - {name: include_archived, in: query, schema: {type: boolean, default: false}}
        - {name: key_last4, in: query, schema: {type: string, pattern: '^.{4}$'}, description: "Только администратор; остальным — 403."}
      responses:
        '200':
          description: Профили.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TrainerProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: ["Профили тренажёра"]
      operationId: createTrainerProfile
      summary: "Создать профиль или копию существующего"
      description: |
        Пустые поля настроек берутся из профиля по умолчанию. Ключи копией не переносятся — задаются отдельно
        (`PUT …/keys`). Настройки закрыты схемой: поле вне схемы — 422 с путём к полю, поэтому ключ или токен
        в настройки не положить. Адрес со встроенным логином (`https://user:pass@…`) или с параметрами запроса
        (`?key=…`) — 422: так ключ попал бы к наблюдателю и участнику вместе с адресом.
      x-roles: [admin]
      x-uc: [UC-A-01]
      x-fr: [FR-PF-01, NFR-C-01, NFR-C-02]
      security:
        - portalCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainerProfileCreate'}
      responses:
        '201':
          description: Профиль создан.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerProfileAdmin'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/trainer-profiles/{profileId}:
    get:
      tags: ["Профили тренажёра"]
      operationId: getTrainerProfile
      summary: "Профиль тренажёра"
      x-roles: [methodologist, observer, admin]
      x-uc: [UC-A-01, UC-A-04, UC-M-08]
      x-fr: [FR-PF-01, FR-PF-04]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Профиль (вид зависит от роли).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: ["Профили тренажёра"]
      operationId: updateTrainerProfile
      summary: "Изменить настройки профиля"
      description: |
        Ревизия +1; действует со следующего старта, идущие сессии доигрывают на прежней (FR-PF-03). Лимит ходов
        больше, чем помещается в окно контекста самой ограниченной модели, или не заданная длина ответа — 422
        с допустимым максимумом в тексте. Поле вне схемы настроек и адрес со встроенным логином или параметрами
        запроса — 422, как при создании. Ответ сообщает, сколько сессий по профилю идёт сейчас.
      x-roles: [admin]
      x-uc: [UC-A-01, UC-A-04]
      x-fr: [FR-PF-01, FR-PF-03, NFR-C-01, NFR-C-02, NFR-S-03]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainerProfilePatch'}
      responses:
        '200':
          description: Сохранено.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerProfileAdmin'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/trainer-profiles/{profileId}/keys:
    put:
      tags: ["Профили тренажёра"]
      operationId: replaceTrainerProfileKeys
      summary: "Задать или заменить ключ OpenRouter и токен нашего сервера"
      description: |
        Только запись: ключ целиком в ответах не возвращается никогда, даже администратору, — только последние
        4 символа. Поле не передано — не меняется; `null` — удалить. Каждая замена — запись
        `profile_key_changed` в журнале. Новый ключ получат клиенты при следующем старте (NFR-S-01).
      x-roles: [admin]
      x-uc: [UC-A-03, UC-A-01, UC-A-04]
      x-fr: [FR-PF-04, NFR-S-01, NFR-S-03]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainerProfileKeys'}
      responses:
        '200':
          description: Ключи сохранены.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerProfileAdmin'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/portal/trainer-profiles/{profileId}/check:
    post:
      tags: ["Профили тренажёра"]
      operationId: checkTrainerProfile
      summary: "Проверить профиль: три модели и синтез речи"
      description: |
        Портал сам отправляет короткий запрос каждой модели и синтезу речи и возвращает по строке на каждый:
        ответил ли, сколько занял, ошибка обычными словами. Строки проверяются независимо. До 20 секунд.
      x-roles: [admin]
      x-uc: [UC-A-02, UC-A-04]
      x-fr: [FR-PF-06, NFR-R-03, NFR-P-03]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Результат проверки.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCheckResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/portal/trainer-profiles/{profileId}/archive:
    post:
      tags: ["Профили тренажёра"]
      operationId: archiveTrainerProfile
      summary: "Архивировать профиль"
      description: "Удаления профилей нет. Профиль по умолчанию архивировать нельзя — 409 (FR-PF-05)."
      x-roles: [admin]
      x-uc: [UC-A-04]
      x-fr: [FR-PF-05]
      security:
        - portalCookie: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: В архиве.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerProfileAdmin'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

