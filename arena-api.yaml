      tags: ["Аналитика"]
      operationId: compareEmployees
      summary: "Сравнение сотрудников в равных условиях"
      description: |
        Равные условия (FR-ST-05): версия (режим выводится из неё), уровень, набор критериев, профиль оценки.
        Пока выбраны не все нужные условия, ответ 200 с `complete = false`, пустыми `rows` и `available_conditions`
        — сочетаниями условий в группе с числом сессий; экран предлагает выбрать одно. Набор критериев и профиль
        оценки можно не передавать, если в выборке «версия + уровень» они одинаковы; если разные — тот же ответ
        с `available_conditions`, экран спрашивает (UC-H-07). Строка — сотрудник: число попыток, последняя попытка,
        обе оценки отдельно. Сортировка по одной оценке: `result` — по букве, затем по числу; `process` — по числу.
        Двух оценок вместе нет (FR-RS-04). Упрощённые по умолчанию исключены и посчитаны отдельно; сессии без
        буквы не входят. Все попытки строки — `GET /api/portal/sessions` с теми же условиями.
      x-roles: [methodologist, observer, admin]
      x-group-access: true
      x-uc: [UC-H-07, UC-S-04]
      x-fr: [FR-ST-05, FR-ST-09, FR-MD-02, NFR-R-02, FR-RS-04, FR-RS-13]
      security:
        - portalCookie: []
      parameters:
        - {name: group_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: scenario_version_id, in: query, schema: {type: string, format: uuid}}
        - {name: difficulty, in: query, schema: {$ref: '#/components/schemas/Difficulty'}}
        - {name: criteria_set, in: query, schema: {type: string, example: harvard_spin_v1}}
        - {name: scoring_profile, in: query, schema: {$ref: '#/components/schemas/ScoringProfile'}}
        - {name: sort, in: query, schema: {type: string, enum: [result, process], default: result}}
        - {name: include_simplified, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Таблица сравнения или список условий на выбор.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComparisonTable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/portal/analytics/groups:
    get:
      tags: ["Аналитика"]
      operationId: getGroupAnalytics
      summary: "Аналитика группы: слабые критерии и распределение оценок"
      description: |
        Первый блок — самый слабый критерий готовой фразой (FR-ST-04). Для двух и более групп (FR-ST-10) нужны
        `scenario_version_id` и `difficulty`, иначе 422. Учитываются сессии с полученным «процессом», без демо.
        Выборка меньше 30 — `small_sample`.
      x-roles: [methodologist, observer, admin]
      x-group-access: true
      x-uc: [UC-H-08]
      x-fr: [FR-ST-04, FR-ST-07, FR-ST-09, FR-ST-10, FR-ST-05]
      security:
        - portalCookie: []
      parameters:
        - {name: group_id, in: query, required: true, style: form, explode: true, schema: {type: array, minItems: 1, maxItems: 5, items: {type: string, format: uuid}}}
        - $ref: '#/components/parameters/FilterFrom'
        - $ref: '#/components/parameters/FilterTo'
        - {name: scenario_id, in: query, schema: {type: string, format: uuid}}
        - {name: scenario_version_id, in: query, schema: {type: string, format: uuid}}
        - {name: difficulty, in: query, schema: {$ref: '#/components/schemas/Difficulty'}}
        - {name: mode, in: query, schema: {$ref: '#/components/schemas/Mode'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SessionStatus'}}
      responses:
        '200':
          description: Блоки по группам.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/GroupAnalytics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

