        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/portal/sessions/{sessionId}/reduced:
    get:
      tags: ["Здоровье сценария"]
      operationId: getReducedSession
      summary: "Урезанный вид сессии: без имени и текста реплик"
      description: |
        Для автора без доступа к группе участника (FR-ST-02): путь по этапам, типы ходов, предложения сторон,
        сработавшие переходы, нарушения оппонента по видам. Ни имени, ни номера участника, ни текста реплик,
        ни цитат. Открытие пишется в журнал (`session_reduced_opened`). Демо-сессии — 404.
      x-roles: [methodologist, admin]
      x-uc: [UC-M-11]
      x-fr: [FR-ST-02, FR-AC-08, NFR-S-03]
      security:
        - portalCookie: []
      parameters:
