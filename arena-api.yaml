openapi: 3.1.0
info:
  title: "Арена переговоров — API портала"
  version: 0.1.0
  description: |
    API портала HR «Арена переговоров». Два потребителя:

    - `/api/trainer/*` — приложение-тренажёр: участник (токен участника или гостевой токен демо) и методолог
      на репетиции (одноразовая ссылка из портала → токен репетиции);
    - `/api/portal/*` — веб-портал HR (методолог, наблюдатель, администратор; cookie сессии входа).

    Соглашения, вход, таблица всех адресов, последовательность запросов до первой реплики и состояния
    сессии — в `arena-api.md`. Здесь — формы запросов и ответов.

    Расширения у каждой операции: `x-roles` — кто может вызвать; `x-group-access: true` — нужен доступ
    к группе (FR-AC-08); `x-uc`, `x-fr` — варианты использования и требования; `x-public: true` — адрес
    без входа (тогда `security: []`).

    Полей для эмоций нет ни в одной схеме (FR-RS-02). Объекты пакета движка внутри тел (`engine_step`, `judge`,
    `opponent_judge`, `offer`, `terms`, `client_scores`) портал проверяет по закрытым JSON-схемам, которые экспортирует
    пакет движка. Дополнительно тело, где встречается ключ с именем ровно `emotion` (точное совпадение имени, не
    подстрока) на любой глубине, отклоняется с 400 до записи тела куда-либо.
servers:
  - url: /
tags:
  - name: "Тренажёр — вход"
  - name: "Тренажёр — сессия"
  - name: "Тренажёр — результаты"
  - name: "Тренажёр — демо"
  - name: "Тренажёр — репетиция"
  - name: "Портал — вход"
  - name: "Сценарии"
  - name: "Генерация из брифа"
  - name: "Репетиции"
  - name: "Здоровье сценария"
  - name: "Назначения"
  - name: "Группы и сотрудники"
  - name: "Сессии"
  - name: "Аналитика"
  - name: "Выгрузки"
  - name: "Кадровые решения"
  - name: "Возражения"
  - name: "Профили тренажёра"
  - name: "Пользователи и доступ"
  - name: "Журнал"
  - name: "Настройки портала"

paths:
  # =====================================================================
  # ТРЕНАЖЁР
  # =====================================================================
  /api/trainer/enter:
    post:
      tags: ["Тренажёр — вход"]
      operationId: trainerEnter
      summary: "Запрос 1: ввод кода — токен участника и настройки"
      description: |
        Первый из трёх запросов до первой реплики (NFR-P-02). Обменивает код доступа на токен участника
        и сразу отдаёт настройки: публичную часть сценария с уровнем назначения, профиль тренажёра
        **без ключей** (только адреса моделей) и тексты для экрана «Согласие и уведомление».

        Если по назначению идёт сессия, `next = resume` и `running_session_id` — клиент вызывает
        `GET /api/trainer/sessions/{sessionId}/private` (FR-AC-03, F5). Если есть завершённые сессии —
        `has_results = true`; в оценке с завершённой сессией `next = results`.

        Неверный код увеличивает счётчик неудачных попыток кода (по селектору); на пороге из настроек
        код блокируется насовсем (NFR-S-02). Ограничение частоты по адресу — 10 запросов в минуту.
      x-public: true
      x-roles: [public]
      x-uc: [UC-P-01, UC-P-06, UC-P-09]
      x-fr: [FR-AC-02, FR-AC-03, FR-AC-04, FR-AC-07, FR-AC-13, FR-PF-02, NFR-P-02, NFR-S-01, NFR-S-02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnterRequest'}
      responses:
        '200':
          description: Код принят.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnterResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/trainer/consents:
    post:
      tags: ["Тренажёр — вход"]
      operationId: trainerRecordConsents
      summary: "Запрос 2: ответ на согласие или уведомление"
      description: |
        Второй запрос (NFR-P-02). Все ответы экрана одним запросом: уведомление или согласие по режиму
        и отдельный ответ про внешнюю нейросеть (если вопрос показывался). Портал сверяет
        `shown_text_sha256` со своим текстом с подстановками; не совпало — 409 «текст изменился,
        обновите страницу». В базу пишется не этот хеш, а HMAC текста на ключе данных участника (arena-db.md, 6).
        Отказ тоже записывается. Повтор запроса создаёт ещё одну запись — это безвредно: таблица только
        дополняется, а сессия ссылается на один ответ.
      x-roles: [participant, guest]
      x-uc: [UC-P-02, UC-P-11]
      x-fr: [FR-AC-05, FR-AC-06, FR-AC-07, FR-AC-13, NFR-P-02]
      security:
        - trainerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentsRequest'}
      responses:
        '201':
          description: Ответы записаны.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/trainer/sessions:
    post:
      tags: ["Тренажёр — сессия"]
      operationId: trainerStartSession
      summary: "Запрос 3: старт сессии — приватная половина и доступ к моделям"
      description: |
        Третий запрос (NFR-P-02). Создаёт сессию и отдаёт приватную половину сценария (формат, раздел 16),
        токен нашего сервера с моделями и — **только если** в `consent_ids` есть «даю» на внешнюю нейросеть
        и согласие не отозвано — ключ OpenRouter (FR-AC-07, NFR-S-01). Профиль фиксируется ревизией
        на момент старта (FR-PF-03).

        В `consent_ids` — записи этого участника из запроса 2, не отказы; основной ответ (уведомление или согласие)
        служит одной попытке (`sessions_one_per_consent`), повторно использованный — 409 `consent_required`.

        **Демо.** Для `is_demo` оба поля `model_access` равны `null`, модели работают на заглушке. Исключение —
        переменная окружения `DEMO_MODEL_KEYS=1`, её включают только на стенде жюри (arena-api.md, 8).

        Если по назначению уже идёт сессия, возвращается она же с кодом 200 (двойное нажатие, F5).
        В оценке после завершённой сессии новая не создаётся (409); в тренировке — новая попытка,
        но с новыми ответами на согласие.
      x-roles: [participant, guest]
      x-uc: [UC-P-03, UC-P-11]
      x-fr: [FR-AC-03, FR-AC-04, FR-AC-06, FR-AC-07, FR-AC-10, FR-PF-02, FR-PF-03, NFR-P-02, NFR-S-01, NFR-S-02]
      security:
        - trainerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartSessionRequest'}
      responses:
        '200':
          description: Сессия уже идёт — возвращена она.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStartResponse'}
        '201':
          description: Сессия начата.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStartResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/trainer/sessions/{sessionId}/private:
    get:
      tags: ["Тренажёр — сессия"]
      operationId: trainerGetPrivatePart
      summary: "Повторная выдача приватной половины идущей сессии (F5)"
      description: |
        Только для сессии в статусе `in_progress`: та же приватная половина, доступ к моделям по тем же
        правилам согласия и состояние для восстановления (ходы, этап, шкалы, прошедшее время).
        Для завершённой или прерванной сессии — 409 `session_finished` (FR-AC-04). Согласие повторно
        не спрашивается. Вход по коду плюс этот запрос — два запроса до продолжения разговора.
      x-roles: [participant, guest]
      x-uc: [UC-P-06]
      x-fr: [FR-AC-03, FR-AC-04, FR-AC-07, NFR-S-02]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Приватная половина и состояние.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionStartResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/trainer/sessions/{sessionId}/events:
    post:
      tags: ["Тренажёр — сессия"]
      operationId: trainerPostEvents
      summary: "Пачка событий хода: реплики и отказы компонентов"
      description: |
        Клиент шлёт события пачками — сразу после хода или из локального буфера после потери связи
        (FR-AC-11). Реплика — одно событие, уже с решением своего судьи. Повтор реплики с тем же `seq`
        отбрасывается (ключ `(session_id, seq)`), повтор отказа — по `event_id`. Пустая пачка — отметка
        «клиент жив» (продлевает таймаут).

        Если сессия была закрыта сервером (`abandoned`), поздние события открывают её снова:
        статус `in_progress`, `reopened_count + 1` (FR-ST-03). Если по назначению тем временем идёт
        другая сессия, ходы дописываются, а статус остаётся «прервана».

        Если хоть одна реплика пачки разобрана по ключевым словам, тот же UPDATE ставит `simplified = true`
        и снимает отметку «просмотрено» (`reviewed_at`, `reviewed_by`, `reviewed_violation_count` → `null`):
        упрощённая сессия не годится для решения (NFR-R-02). Новые нарушения оппонента увеличивают
        `opponent_violation_count` — прежняя отметка перестаёт покрывать их сама (arena-db.md, 4).

        `engine_step`, `judge`, `opponent_judge`, `offer`, `terms` проверяются по закрытым схемам пакета движка;
        `comment` судьи оппонента передаётся только в `opponent_judge_comment`, внутри `opponent_judge` — 400.

        Работает и после отмены назначения или отзыва кода: идущая сессия доигрывается.
      x-roles: [participant, guest]
      x-uc: [UC-P-04, UC-P-07, UC-S-01, UC-S-02, UC-S-04, UC-S-05]
      x-fr: [FR-AC-11, FR-ST-03, FR-ST-08, FR-RS-01, FR-RS-02, FR-RS-13, NFR-R-01, NFR-R-02]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventBatch'}
      responses:
        '200':
          description: Пачка принята (в том числе целиком из дублей).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventBatchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}

  /api/trainer/sessions/{sessionId}/finish:
    post:
      tags: ["Тренажёр — сессия"]
      operationId: trainerFinishSession
      summary: "Завершение сессии с ответом судьи после разговора"
      description: |
        Закрывает сессию с причиной и финалом, сохраняет ответ судьи участника после разговора **как пришёл**
        (шифруется ключом участника) и число запросов к нему. Портал пересчитывает обе оценки функциями
        пакета движка той же версии (arena-scoring 1.3, 9) и возвращает свой расчёт в виде для участника.

        Если на портале нет ходов до `last_seq` — 409 со списком недостающих номеров: клиент досылает события
        и повторяет. Повтор завершения возвращает сохранённый результат; тело повтора не сравнивается. Завершение прерванной
        сервером сессии допустимо (поздние события, arena-scoring 3.4).

        `judge_answer = null` и `judge_attempts = 0` — ответа ещё ждём (`pending`); `null` при попытках ≥ 1 —
        «процесс не получен». Меньше трёх реплик участника — `too_short`.
      x-roles: [participant, guest]
      x-uc: [UC-P-04, UC-P-05, UC-P-07, UC-P-08, UC-S-03]
      x-fr: [FR-RS-01, FR-RS-03, FR-RS-04, FR-RS-06, FR-RS-07, FR-ST-03, NFR-R-02]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinishRequest'}
      responses:
        '200':
          description: Сессия закрыта; результат в расчёте портала.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/trainer/sessions/{sessionId}/judge-retry:
    get:
      tags: ["Тренажёр — сессия"]
      operationId: trainerGetJudgeRetryPack
      summary: "Данные для повторного запроса к судье после разговора"
      description: |
        Исключение из FR-AC-04 (arena-scoring 8.3): для завершённой сессии без оценки «процесс»
        (`process_status` = `pending` или `not_received`) портал выдаёт только то, что нужно судье:
        транскрипт, решения судьи по репликам, журнал предложений, интересы оппонента, тексты раскрытых
        фактов, бриф участника — и доступ к моделям по правилам согласия. Пределов оппонента, этапов
        и условий переходов здесь нет. В остальных случаях — 409.
      x-roles: [participant, guest]
      x-uc: [UC-P-08, UC-P-09]
      x-fr: [FR-AC-04, FR-AC-07, FR-RS-01]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Пакет для повторного запроса.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JudgeRetryPack'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/trainer/sessions/{sessionId}/judge-answer:
    post:
      tags: ["Тренажёр — сессия"]
      operationId: trainerPostJudgeAnswer
      summary: "Ответ судьи после разговора, полученный повторно"
      description: |
        Сохраняет ответ судьи как пришёл, пересчитывает «процесс» и возвращает результат. Если проверенный
        ответ уже сохранён (`process_status = ok`) — 409: сохранённый ответ не перезапрашивается (arena-scoring 8.3).
      x-roles: [participant, guest]
      x-uc: [UC-P-08]
      x-fr: [FR-RS-01, FR-RS-07]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JudgeAnswerRequest'}
      responses:
        '200':
          description: Ответ сохранён, оценки пересчитаны.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/trainer/sessions/{sessionId}/objections:
    post:
      tags: ["Тренажёр — результаты"]
      operationId: trainerCreateObjection
      summary: "Подать возражение к результату"
      description: |
        Текст шифруется ключом участника. Возражение сразу видно HR на экране результата (FR-RS-09).
        Пустой текст — 422.
      x-roles: [participant]
      x-uc: [UC-P-10]
      x-fr: [FR-RS-09, NFR-R-03]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObjectionCreate'}
      responses:
        '201':
          description: Возражение записано.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantObjection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /api/trainer/results:
    get:
      tags: ["Тренажёр — результаты"]
      operationId: trainerListResults
      summary: "Мои результаты: попытки и динамика"
      description: |
        Все сессии участника (по номеру участника, по всем его назначениям) и линии динамики — отдельно
        для каждой пары «версия + уровень» (FR-RS-12). Тренировки и упрощённый режим помечены.
        Гостевой токен демо видит только сессии со своим `demo_guest_id` (`sessions.demo_guest_id`).
      x-roles: [participant, guest]
      x-uc: [UC-P-09]
      x-fr: [FR-RS-09, FR-RS-12, FR-RS-04, FR-MD-02, NFR-R-02]
      security:
        - trainerToken: []
      responses:
        '200':
          description: Попытки и динамика.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantResultList'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/trainer/results/{sessionId}:
    get:
      tags: ["Тренажёр — результаты"]
      operationId: trainerGetResult
      summary: "Разбор одной своей сессии"
      description: |
        Вид для участника (arena-scoring 12.3): обе оценки отдельно, засчитанные эпизоды с цитатами, резюме,
        транскрипт, поданные возражения и ответы HR. Без пределов оппонента, этапов, баллов предметов,
        отброшенных эпизодов и пошагового разбора. У сессии, закрытой сервером, — только шапка,
        пометка «прервана» и транскрипт. Гостю демо — только сессия с его `demo_guest_id`, иначе 404.
      x-roles: [participant, guest]
      x-uc: [UC-P-08, UC-P-09, UC-P-10]
      x-fr: [FR-RS-04, FR-RS-05, FR-RS-06, FR-RS-07, FR-RS-09, FR-MD-02]
      security:
        - trainerToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Разбор сессии.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParticipantResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/trainer/demo/enter:
    post:
      tags: ["Тренажёр — демо"]
      operationId: trainerDemoEnter
      summary: "Демо: гостевой токен и настройки без кода"
      description: |
        Замена запроса 1 для гостя (UC-P-11). Демо-сценарий, профиль по умолчанию, текст `notice_demo`.
        Дальше — те же запросы 2 и 3: уведомление и согласие на внешнюю нейросеть нужны и в демо (FR-AC-13,
        FR-AC-07). Гостевой токен несёт новый `demo_guest_id`; сессии помечены `is_demo`, пишутся на демо-участника
        с этим номером гостя, без назначения и группы, всегда тренировка (FR-AC-10). Ключей моделей гость
        не получает: `model_access` в старте — `null`, разговор идёт на заглушке (кроме стенда жюри
        с `DEMO_MODEL_KEYS=1`). Демо выключено переменной окружения — 404 с текстом «Демо выключено
        на этом сервере». Ограничение частоты по адресу — 10 в минуту.
