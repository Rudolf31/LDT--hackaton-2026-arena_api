        (FR-SC-15 — это только вид в интерфейсе администратора, отдельного адреса нет). Схемная ошибка — 422
        с путями к полям, черновик не меняется. Ошибки проверки сценария сохранению не мешают, они
        возвращаются в `check` и блокируют только публикацию (FR-SC-08).

